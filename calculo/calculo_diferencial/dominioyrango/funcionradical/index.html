<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title id="page-title"></title>

<script id="MathJax-script" async
src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.0/es5/tex-mml-chtml.js"></script>

<style>
body{
    background:#ccffcc;
    font-size:18px;
}
#quiz-container{
    width:80%;
    max-width:600px;
    margin:auto;
    text-align:center;
    background:#fff;
    padding:20px;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    display:none;
}
.question-container,.option-container{
    background:#f0f0f0;
    border:1px solid #ddd;
    margin:10px 0;
    padding:16px;
    border-radius:5px;
}
#options{
    padding-left:0;
}
#options li{
    list-style:none;
    margin:5px 0;
    padding:15px;
    background:#e9ffe9;
    cursor:pointer;
    border-radius:5px;
}
#options li:hover{
    background:#d0ffd0;
}
button{
    margin-top:15px;
    padding:10px 20px;
    font-size:16px;
}
#question-number{
    font-size:20px;
    margin-bottom:10px;
}
.warning-box{
    width:80%;
    max-width:700px;
    margin:20px auto;
    padding:15px;
    background:#fff3cd;
    border:2px solid #ffcc00;
    border-radius:8px;
    color:#664d03;
    font-size:20px;
    text-align:center;
}
</style>
</head>

<body>

<div id="start-container" style="text-align:center;margin-top:50px;">

<h1 id="test-title-heading"></h1>

<div class="warning-box">
    <strong>Advertencia:</strong> En caso de cambiar de pestaña, cerrar navegador o cambiar de aplicación se cancelará el avance y se reiniciará el test.
</div>

<h2>Ingresa tu primer nombre y primer apellido</h2>

<input 
    type="text" 
    id="student-name" 
    placeholder="Ejemplo: JUAN PEREZ" 
    style="padding:10px;font-size:18px;text-transform:uppercase;"
    oninput="
        this.value = this.value
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[^A-Za-z\s]/g, '')
            .toUpperCase();
    "
>
<br><br>
<button onclick="startQuiz()">Comenzar Test</button>
</div>

<div id="quiz-container">
<div id="question-number"></div>
<div class="question-container" id="question"></div>
<div id="question-image"></div>
<ul id="options"></ul>
<button id="next-question" onclick="loadNextQuestion()">Siguiente</button>
<button id="finish-test" onclick="finishTest()">Terminar Test</button>
</div>

<div id="result"></div>

<script>

let studentName="";
let currentQuestionIndex=0;
let score=0;
let testStarted=false;

const testTitle = "Dominio y rango de funciones radicales 1";

document.title = testTitle;
document.getElementById("test-title-heading").textContent = testTitle;
const allQuestions = [
{
    pregunta: "¿Cuál es el dominio de la función \\(f(x) = \\sqrt{x-5} + 3\\)?",
    imagen: "",
    opciones: [
        "\\((-\\infty, 5)\\)",
        "\\((5, +\\infty)\\)",
        "\\([5, +\\infty)\\)",
        "\\(\\mathbb{R}\\)"
    ],
    respuestaCorrecta: "\\([5, +\\infty)\\)",
    formula: "Dom: radicando \\(\\geq 0\\)",
    explicacion: "Para que la raíz esté definida: \\(x - 5 \\geq 0 \\Rightarrow x \\geq 5\\). El dominio es \\([5, +\\infty)\\). Se incluye \\(x=5\\) porque en ese punto \\(\\sqrt{0} = 0\\). ✓"
},
{
    pregunta: "¿Cuál es el rango de la función \\(f(x) = \\sqrt{x-5} + 3\\)?",
    imagen: "",
    opciones: [
        "\\((-\\infty, 3)\\)",
        "\\((3, +\\infty)\\)",
        "\\([3, +\\infty)\\)",
        "\\([0, +\\infty)\\)"
    ],
    respuestaCorrecta: "\\([3, +\\infty)\\)",
    formula: "\\(\\sqrt{x-5} \\geq 0 \\Rightarrow f(x) \\geq 3\\)",
    explicacion: "Como \\(\\sqrt{x-5} \\geq 0\\) para todo \\(x\\) en el dominio, se tiene \\(f(x) = \\sqrt{x-5} + 3 \\geq 0 + 3 = 3\\). El mínimo se alcanza en \\(x=5\\): \\(f(5)=3\\). Rango: \\([3, +\\infty)\\). ✓"
},
{
    pregunta: "¿Cuál es el dominio de \\(f(x) = \\sqrt{2x+8} - 2\\)?",
    imagen: "",
    opciones: [
        "\\([-4, +\\infty)\\)",
        "\\((-4, +\\infty)\\)",
        "\\([-4, +\\infty)\\)",
        "\\((-\\infty, -4]\\)"
    ],
    respuestaCorrecta: "\\([-4, +\\infty)\\)",
    formula: "Dom: radicando \\(\\geq 0\\)",
    explicacion: "Para que la raíz esté definida: \\(2x + 8 \\geq 0 \\Rightarrow x \\geq -4\\). El dominio es \\([-4, +\\infty)\\). ✓"
},
{
    pregunta: "¿Cuál es el dominio de la función \\(f(x) = \\sqrt{-x+7} - 4\\)?",
    imagen: "",
    opciones: [
        "\\([7, +\\infty)\\)",
        "\\((-\\infty, 7]\\)",
        "\\((-\\infty, 7]\\)",
        "\\((7, +\\infty)\\)"
    ],
    respuestaCorrecta: "\\((-\\infty, 7]\\)",
    formula: "Dom: radicando \\(\\geq 0\\)",
    explicacion: "Para que la raíz esté definida: \\(-x + 7 \\geq 0 \\Rightarrow x \\leq 7\\). El dominio es \\((-\\infty, 7]\\). Nota: al despejar se invierte la desigualdad porque se divide entre \\(-1\\). ✓"
},
{
    pregunta: "Para la función \\(f(x) = \\sqrt{4x-12} + 5\\), ¿cuál es el rango?",
    imagen: "",
    opciones: [
        "\\([0, +\\infty)\\)",
        "\\([3, +\\infty)\\)",
        "\\([5, +\\infty)\\)",
        "\\((-\\infty, 5]\\)"
    ],
    respuestaCorrecta: "\\([5, +\\infty)\\)",
    formula: "\\(\\sqrt{4x-12} \\geq 0 \\Rightarrow f(x) \\geq 5\\)",
    explicacion: "Dom: \\(4x-12 \\geq 0 \\Rightarrow x \\geq 3\\). Como \\(\\sqrt{4x-12} \\geq 0\\), se tiene \\(f(x) \\geq 5\\). El mínimo se alcanza en \\(x=3\\): \\(f(3) = 0 + 5 = 5\\). Rango: \\([5, +\\infty)\\). ✓"
},
{
    pregunta: "¿Cuál es el rango de \\(f(x) = \\sqrt{-2x+10} - 3\\)?",
    imagen: "",
    opciones: [
        "\\([-3, +\\infty)\\)",
        "\\((-\\infty, -3]\\)",
        "\\((-\\infty, -3]\\)",
        "\\([0, +\\infty)\\)"
    ],
    respuestaCorrecta: "\\([-3, +\\infty)\\)",
    formula: "\\(\\sqrt{-2x+10} \\geq 0 \\Rightarrow f(x) \\geq -3\\)",
    explicacion: "La raíz cuadrada siempre es \\(\\geq 0\\), independientemente del signo del coeficiente de \\(x\\) dentro del radicando. Por tanto \\(f(x) = \\sqrt{-2x+10} - 3 \\geq 0 - 3 = -3\\). El mínimo se alcanza cuando \\(-2x+10 = 0 \\Rightarrow x=5\\): \\(f(5) = -3\\). Rango: \\([-3, +\\infty)\\). La opción \\((-\\infty,-3]\\) es incorrecta."
},
{
    pregunta: "¿Cuál es el dominio de \\(f(x) = \\sqrt{5x+15} + 2\\)?",
    imagen: "",
    opciones: [
        "\\([-3, +\\infty)\\)",
        "\\([3, +\\infty)\\)",
        "\\([-3, +\\infty)\\)",
        "\\((-\\infty, -3]\\)"
    ],
    respuestaCorrecta: "\\([-3, +\\infty)\\)",
    formula: "Dom: radicando \\(\\geq 0\\)",
    explicacion: "Para que la raíz esté definida: \\(5x + 15 \\geq 0 \\Rightarrow 5x \\geq -15 \\Rightarrow x \\geq -3\\). El dominio es \\([-3, +\\infty)\\). ✓"
},
{
    pregunta: "Para la función \\(f(x) = \\sqrt{6-2x} + 7\\), ¿cuál es el rango?",
    imagen: "",
    opciones: [
        "\\([0, +\\infty)\\)",
        "\\([7, +\\infty)\\)",
        "\\([7, +\\infty)\\)",
        "\\((-\\infty, 7]\\)"
    ],
    respuestaCorrecta: "\\([7, +\\infty)\\)",
    formula: "\\(\\sqrt{6-2x} \\geq 0 \\Rightarrow f(x) \\geq 7\\)",
    explicacion: "Como \\(\\sqrt{6-2x} \\geq 0\\), se tiene \\(f(x) \\geq 7\\). El mínimo se alcanza cuando \\(6-2x=0 \\Rightarrow x=3\\): \\(f(3) = 0+7 = 7\\). Rango: \\([7, +\\infty)\\). ✓"
},
{
    pregunta: "¿Cuál es el dominio de \\(f(x) = \\sqrt{x+4} - 6\\)?",
    imagen: "",
    opciones: [
        "\\([-4, +\\infty)\\)",
        "\\([0, +\\infty)\\)",
        "\\([-4, +\\infty)\\)",
        "\\((-\\infty, -4]\\)"
    ],
    respuestaCorrecta: "\\([-4, +\\infty)\\)",
    formula: "Dom: radicando \\(\\geq 0\\)",
    explicacion: "Para que la raíz esté definida: \\(x + 4 \\geq 0 \\Rightarrow x \\geq -4\\). El dominio es \\([-4, +\\infty)\\). El \\(-6\\) no afecta al dominio. ✓"
},
];

const questions=[...allQuestions]
.sort(()=>0.5-Math.random())
.slice(0,5);

questions.forEach(q=>{
q.selectedAnswer=null;
q.opciones=[...q.opciones].sort(()=>0.5-Math.random());
});

function startQuiz(){
const name=document.getElementById("student-name").value.trim();
if(name===""){alert("Escribe tu nombre");return;}
studentName=name;
testStarted=true;
document.getElementById("start-container").style.display="none";
document.getElementById("quiz-container").style.display="block";
loadQuestion(currentQuestionIndex);
}

function loadQuestion(index){

const question=questions[index];
document.getElementById("question").innerHTML=question.pregunta;
document.getElementById("question-image").innerHTML="";

if(question.imagen){
const img=document.createElement("img");
img.src=question.imagen;
img.style.maxWidth="100%";
document.getElementById("question-image").appendChild(img);
}

document.getElementById("question-number").innerHTML=
`Pregunta ${index+1} de ${questions.length}`;

const optionsContainer=document.getElementById("options");
optionsContainer.innerHTML="";

question.opciones.forEach(option=>{
const li=document.createElement("li");
li.innerHTML=option;

li.onclick=()=>{
if(question.selectedAnswer!==null) return;

question.selectedAnswer=option;
li.style.backgroundColor="#66cc66";

document.getElementById("next-question").style.display=
index<questions.length-1?"inline-block":"none";

document.getElementById("finish-test").style.display=
index===questions.length-1?"inline-block":"none";
};

optionsContainer.appendChild(li);
});

document.getElementById("next-question").style.display="none";
document.getElementById("finish-test").style.display="none";

MathJax.typesetPromise();
}

function loadNextQuestion(){
currentQuestionIndex++;
loadQuestion(currentQuestionIndex);
}

function finishTest(){

score=0;

questions.forEach(q=>{
if(q.selectedAnswer===q.respuestaCorrecta){
score++;
}
});

const total=questions.length;
const errores=total-score;
const porcentaje=((score/total)*100).toFixed(2);

document.getElementById("quiz-container").style.display="none";

let html=`<h2>Resultado</h2>
<p>${studentName}, obtuviste <strong>${score}</strong> de ${total} (${porcentaje}%).</p>
<h3>Revisión:</h3>`;

questions.forEach(q=>{

let correcta=q.selectedAnswer===q.respuestaCorrecta;
let fondo=correcta?"#d4edda":"#f8d7da";
let borde=correcta?"#28a745":"#dc3545";
let icono=correcta?"✔ Correcta":"✘ Incorrecta";

html+=`
<div style="
background:${fondo};
border:2px solid ${borde};
margin:12px 0;
padding:16px;
border-radius:8px;
">
<strong>${icono}</strong><br><br>
<strong>Pregunta:</strong> ${q.pregunta}<br>
<strong>Tu respuesta:</strong> ${q.selectedAnswer || "No respondida"}<br>
<strong>Respuesta correcta:</strong> ${q.respuestaCorrecta}<br><br>
<strong>Explicación:</strong> ${q.explicacion}
</div>
`;
});

document.getElementById("result").innerHTML=html;
MathJax.typesetPromise();

const resumenPreguntas = questions.map((q, index) => {
    return {
        numero: index + 1,
        pregunta: q.pregunta,
        imagen: q.imagen || "",
        respuestaSeleccionada: q.selectedAnswer || "No respondida",
        respuestaCorrecta: q.respuestaCorrecta,
        formula: q.formula || "N/A",
        explicacion: q.explicacion || "N/A",
        resultado: q.selectedAnswer === q.respuestaCorrecta ? "Correcta" : "Incorrecta"
    };
});

fetch("https://script.google.com/macros/s/AKfycbxVg3d9f54YEtoiVBBv_OCZM-K7f5CpLKD8BDPFaDnW70whe_D2jsARIepNDxSxxa6I/exec",{
method:"POST",
body:JSON.stringify({
titulo:testTitle,
nombre:studentName,
aciertos:score,
errores:errores,
total:total,
porcentaje:porcentaje,
preguntas:resumenPreguntas
})
});
}

document.addEventListener("visibilitychange", function(){
    if(document.hidden && testStarted){
        location.reload();
    }
});

</script>
</body>
</html>
