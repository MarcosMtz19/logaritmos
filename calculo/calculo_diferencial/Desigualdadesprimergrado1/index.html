<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title id="page-title"></title>

<script id="MathJax-script" async
src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.0/es5/tex-mml-chtml.js"></script>

<style>
body{
    background:#ccffcc;
    font-size:18px;
}
#quiz-container{
    width:80%;
    max-width:600px;
    margin:auto;
    text-align:center;
    background:#fff;
    padding:20px;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    display:none;
}
.question-container,.option-container{
    background:#f0f0f0;
    border:1px solid #ddd;
    margin:10px 0;
    padding:16px;
    border-radius:5px;
}
#options{
    padding-left:0;
}
#options li{
    list-style:none;
    margin:5px 0;
    padding:15px;
    background:#e9ffe9;
    cursor:pointer;
    border-radius:5px;
}
#options li:hover{
    background:#d0ffd0;
}
button{
    margin-top:15px;
    padding:10px 20px;
    font-size:16px;
}
#question-number{
    font-size:20px;
    margin-bottom:10px;
}
.warning-box{
    width:80%;
    max-width:700px;
    margin:20px auto;
    padding:15px;
    background:#fff3cd;
    border:2px solid #ffcc00;
    border-radius:8px;
    color:#664d03;
    font-size:20px;
    text-align:center;
}
</style>
</head>

<body>

<div id="start-container" style="text-align:center;margin-top:50px;">

<h1 id="test-title-heading"></h1>

<div class="warning-box">
    <strong>Advertencia:</strong> En caso de cambiar de pestaña, cerrar navegador o cambiar de aplicación se cancelará el avance y se reiniciará el test.
</div>

<h2>Ingresa tu primer nombre y primer apellido</h2>

<input 
    type="text" 
    id="student-name" 
    placeholder="Ejemplo: JUAN PEREZ" 
    style="padding:10px;font-size:18px;text-transform:uppercase;"
    oninput="
        this.value = this.value
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[^A-Za-z\s]/g, '')
            .toUpperCase();
    "
>
<br><br>
<button onclick="startQuiz()">Comenzar Test</button>
</div>

<div id="quiz-container">
<div id="question-number"></div>
<div class="question-container" id="question"></div>
<div id="question-image"></div>
<ul id="options"></ul>
<button id="next-question" onclick="loadNextQuestion()">Siguiente</button>
<button id="finish-test" onclick="finishTest()">Terminar Test</button>
</div>

<div id="result"></div>

<script>

let studentName="";
let currentQuestionIndex=0;
let score=0;
let testStarted=false;

const testTitle = "Inecuaciones de primer grado (Parte 1)";

document.title = testTitle;
document.getElementById("test-title-heading").textContent = testTitle;
const allQuestions = [
{
    pregunta: "Resuelve la inecuación: \\(\\dfrac{2x-3}{4} + \\dfrac{x+1}{2} > 1\\)",
    imagen: "",
    opciones: [
        "\\(x > \\frac{5}{4}\\)",
        "\\(x <-\\frac{5}{4}\\)",
        "\\(x > -\\frac{5}{4}\\)",
        "\\(x < \\frac{5}{4}\\)"
    ],
    respuestaCorrecta: "\\(x > \\frac{5}{4}\\)",
    formula: "N/A",
    explicacion: "Multiplicamos todo por 4 (MCM): "
},
{
    pregunta: "Resuelve la inecuación: \\(3(2x-1) - 2(x+4) \\leq 5(x-2)\\)",
    imagen: "",
    opciones: [
        "\\(x \\geq 3\\)",
        "\\(x \\leq 3\\)",
        "\\(x \\geq -1\\)",
        "\\(x \\leq -3\\)"
    ],
    respuestaCorrecta: "\\(x \\geq -1\\)",
    formula: "Distribución y simplificación",
    explicacion: "Expandiendo: \\(6x - 3 - 2x - 8 \\leq 5x - 10\\). Simplificando el lado izquierdo: \\(4x - 11 \\leq 5x - 10\\). Despejando \\(x\\): \\(-11 + 10 \\leq 5x - 4x \\Rightarrow -1 \\leq x\\), es decir \\(x \\geq -1\\). La respuesta oficial es \\(x \\geq -1\\)."
},
{
    pregunta: "Resuelve la inecuación: \\(\\dfrac{5x+2}{3} \\geq \\dfrac{x-4}{2}\\)",
    imagen: "",
    opciones: [
        "\\(x \\geq -\\dfrac{16}{7}\\)",
        "\\(x \\leq -\\dfrac{16}{7}\\)",
        "\\(x \\geq \\dfrac{16}{7}\\)",
        "\\(x \\leq \\dfrac{16}{7}\\)"
    ],
    respuestaCorrecta: "\\(x \\geq -\\dfrac{16}{7}\\)",
    formula: "MCM de 3 y 2 es 6",
    explicacion: "Multiplicamos por 6: \\(2(5x+2) \\geq 3(x-4)\\). Expandiendo: \\(10x + 4 \\geq 3x - 12\\). Despejando: \\(7x \\geq -16 \\Rightarrow x \\geq -\\dfrac{16}{7}\\). ✓"
},
{
    pregunta: "Resuelve la inecuación: \\(-2(3x-5) + 4 < 3x - 2(x+1)\\)",
    imagen: "",
    opciones: [
        "\\(x > \\dfrac{16}{7}\\)",
        "\\(x < \\dfrac{7}{16}\\)",
        "\\(x > -\\dfrac{16}{7}\\)",
        "\\(x < -\\dfrac{16}{7}\\)"
    ],
    respuestaCorrecta: "\\(x > \\dfrac{16}{7}\\)",
    formula: "Distribución y simplificación",
    explicacion: "Expandiendo el lado izquierdo: \\(-6x + 10 + 4 < 3x - 2x - 2\\). Simplificando: \\(-6x + 14 < x - 2\\). Despejando: \\(14 + 2 < x + 6x \\Rightarrow 16 < 7x\\). Esto da \\(x > \\dfrac{16}{7}\\)."
},
{
    pregunta: "Resuelve la inecuación: \\(\\dfrac{3x-2}{5} - \\dfrac{2x+1}{3} > \\dfrac{x}{2} - 1\\)",
    imagen: "",
    opciones: [
        "\\(x > \\dfrac{8}{17}\\)",
        "\\(x < \\dfrac{8}{17}\\)",
        "\\(x > -\\dfrac{8}{17}\\)",
        "\\(x < -\\dfrac{17}{8}\\)"
    ],
    respuestaCorrecta: "\\(x < \\dfrac{8}{17}\\)",
    formula: "MCM de 5, 3 y 2 es 30",
    explicacion: "Multiplicamos por 30: \\(6(3x-2) - 10(2x+1) > 15x - 30\\). Expandiendo: \\(18x - 12 - 20x - 10 > 15x - 30\\). Simplificando: \\(-2x - 22 > 15x - 30\\). Despejando: \\(-22 + 30 > 15x + 2x \\Rightarrow 8 > 17x\\). Esto da \\(x < \\dfrac{8}{17}\\)."
},
{
    pregunta: "Resuelve la inecuación: \\(4(x-2) + 3 \\geq 2(x+1) - 5\\)",
    imagen: "",
    opciones: [
        "\\(x \\geq 1\\)",
        "\\(x \\leq 1\\)",
        "\\(x \\geq -1\\)",
        "\\(x \\leq -1\\)"
    ],
    respuestaCorrecta: "\\(x \\geq 1\\)",
    formula: "Distribución y simplificación",
    explicacion: "Expandiendo: \\(4x - 8 + 3 \\geq 2x + 2 - 5\\). Simplificando: \\(4x - 5 \\geq 2x - 3\\). Despejando: \\(4x - 2x \\geq -3 + 5 \\Rightarrow 2x \\geq 2 \\Rightarrow x \\geq 1\\). ✓"
},
{
    pregunta: "Resuelve la inecuación: \\(\\dfrac{3x+1}{2} > \\dfrac{5x-3}{4}\\)",
    imagen: "",
    opciones: [
        "\\(x > -5\\)",
        "\\(x < -5\\)",
        "\\(x > 5\\)",
        "\\(x < 5\\)"
    ],
    respuestaCorrecta: "\\(x > -5\\)",
    formula: "MCM de 2 y 4 es 4",
    explicacion: "Multiplicamos por 4: \\(2(3x+1) > 5x-3 \\Rightarrow 6x+2 > 5x-3\\). Despejando: \\(6x - 5x > -3 - 2 \\Rightarrow x > -5\\). ✓"
},
{
    pregunta: "Resuelve la inecuación: \\(5 - 3(2x-1) \\leq 2(x-4) + 3\\)",
    imagen: "",
    opciones: [
        "\\(x \\geq \\dfrac{13}{8}\\)",
        "\\(x \\leq \\dfrac{13}{8}\\)",
        "\\(x \\geq 2\\)",
        "\\(x \\leq 2\\)"
    ],
    respuestaCorrecta: "\\(x \\geq \\dfrac{13}{8}\\)",
    formula: "Distribución y simplificación",
    explicacion: "Expandiendo: \\(5 - 6x + 3 \\leq 2x - 8 + 3\\). Simplificando: \\(8 - 6x \\leq 2x - 5\\). Despejando: \\(8 + 5 \\leq 2x + 6x \\Rightarrow 13 \\leq 8x \\Rightarrow x \\geq \\dfrac{13}{8}\\). ✓"
},
{
    pregunta: "Resuelve la inecuación: \\(\\dfrac{x}{3} + \\dfrac{2x}{5} > \\dfrac{11}{15}\\)",
    imagen: "",
    opciones: [
        "\\(x > 1\\)",
        "\\(x < 1\\)",
        "\\(x > -1\\)",
        "\\(x < -1\\)"
    ],
    respuestaCorrecta: "\\(x > 1\\)",
    formula: "MCM de 3, 5 y 15 es 15",
    explicacion: "Multiplicamos por 15: \\(5x + 6x > 11 \\Rightarrow 11x > 11 \\Rightarrow x > 1\\). ✓"
},
{
    pregunta: "Resuelve la inecuación: \\(2(3x-4) - 3(x+2) < 4x - 10\\)",
    imagen: "",
    opciones: [
        "\\(x > -4\\)",
        "\\(x < -4\\)",
        "\\(x > 2\\)",
        "\\(x < 2\\)"
    ],
    respuestaCorrecta: "\\(x > -4\\)",
    formula: "Distribución y simplificación",
    explicacion: "Expandiendo: \\(6x - 8 - 3x - 6 < 4x - 10\\). Simplificando: \\(3x - 14 < 4x - 10\\). Despejando: \\(-14 + 10 < 4x - 3x \\Rightarrow -4 < x\\), es decir \\(x > -4\\). ✓"
},
    ];

const questions=[...allQuestions]
.sort(()=>0.5-Math.random())
.slice(0,5);

questions.forEach(q=>{
q.selectedAnswer=null;
q.opciones=[...q.opciones].sort(()=>0.5-Math.random());
});

function startQuiz(){
const name=document.getElementById("student-name").value.trim();
if(name===""){alert("Escribe tu nombre");return;}
studentName=name;
testStarted=true;
document.getElementById("start-container").style.display="none";
document.getElementById("quiz-container").style.display="block";
loadQuestion(currentQuestionIndex);
}

function loadQuestion(index){

const question=questions[index];
document.getElementById("question").innerHTML=question.pregunta;
document.getElementById("question-image").innerHTML="";

if(question.imagen){
const img=document.createElement("img");
img.src=question.imagen;
img.style.maxWidth="100%";
document.getElementById("question-image").appendChild(img);
}

document.getElementById("question-number").innerHTML=
`Pregunta ${index+1} de ${questions.length}`;

const optionsContainer=document.getElementById("options");
optionsContainer.innerHTML="";

question.opciones.forEach(option=>{
const li=document.createElement("li");
li.innerHTML=option;

li.onclick=()=>{
if(question.selectedAnswer!==null) return;

question.selectedAnswer=option;
li.style.backgroundColor="#66cc66";

document.getElementById("next-question").style.display=
index<questions.length-1?"inline-block":"none";

document.getElementById("finish-test").style.display=
index===questions.length-1?"inline-block":"none";
};

optionsContainer.appendChild(li);
});

document.getElementById("next-question").style.display="none";
document.getElementById("finish-test").style.display="none";

MathJax.typesetPromise();
}

function loadNextQuestion(){
currentQuestionIndex++;
loadQuestion(currentQuestionIndex);
}

function finishTest(){

score=0;

questions.forEach(q=>{
if(q.selectedAnswer===q.respuestaCorrecta){
score++;
}
});

const total=questions.length;
const errores=total-score;
const porcentaje=((score/total)*100).toFixed(2);

document.getElementById("quiz-container").style.display="none";

let html=`<h2>Resultado</h2>
<p>${studentName}, obtuviste <strong>${score}</strong> de ${total} (${porcentaje}%).</p>
<h3>Revisión:</h3>`;

questions.forEach(q=>{

let correcta=q.selectedAnswer===q.respuestaCorrecta;
let fondo=correcta?"#d4edda":"#f8d7da";
let borde=correcta?"#28a745":"#dc3545";
let icono=correcta?"✔ Correcta":"✘ Incorrecta";

html+=`
<div style="
background:${fondo};
border:2px solid ${borde};
margin:12px 0;
padding:16px;
border-radius:8px;
">
<strong>${icono}</strong><br><br>
<strong>Pregunta:</strong> ${q.pregunta}<br>
<strong>Tu respuesta:</strong> ${q.selectedAnswer || "No respondida"}<br>
<strong>Respuesta correcta:</strong> ${q.respuestaCorrecta}<br><br>
<strong>Explicación:</strong> ${q.explicacion}
</div>
`;
});

document.getElementById("result").innerHTML=html;
MathJax.typesetPromise();

const resumenPreguntas = questions.map((q, index) => {
    return {
        numero: index + 1,
        pregunta: q.pregunta,
        imagen: q.imagen || "",
        respuestaSeleccionada: q.selectedAnswer || "No respondida",
        respuestaCorrecta: q.respuestaCorrecta,
        formula: q.formula || "N/A",
        explicacion: q.explicacion || "N/A",
        resultado: q.selectedAnswer === q.respuestaCorrecta ? "Correcta" : "Incorrecta"
    };
});

fetch("https://script.google.com/macros/s/AKfycbxVg3d9f54YEtoiVBBv_OCZM-K7f5CpLKD8BDPFaDnW70whe_D2jsARIepNDxSxxa6I/exec",{
method:"POST",
body:JSON.stringify({
titulo:testTitle,
nombre:studentName,
aciertos:score,
errores:errores,
total:total,
porcentaje:porcentaje,
preguntas:resumenPreguntas
})
});
}

document.addEventListener("visibilitychange", function(){
    if(document.hidden && testStarted){
        location.reload();
    }
});

</script>
</body>
</html>
