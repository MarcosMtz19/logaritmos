<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title id="page-title"></title>

<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async
src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.0/es5/tex-mml-chtml.js"></script>

<style>
body{
    background:#ccffcc;
    font-size:18px;
}
#quiz-container{
    width:80%;
    max-width:600px;
    margin:auto;
    text-align:center;
    background:#fff;
    padding:20px;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    display:none;
}
.question-container,.option-container{
    background:#f0f0f0;
    border:1px solid #ddd;
    margin:10px 0;
    padding:16px;
    border-radius:5px;
}
#options{
    padding-left:0;
}
#options li{
    list-style:none;
    margin:5px 0;
    padding:15px;
    background:#e9ffe9;
    cursor:pointer;
    border-radius:5px;
}
#options li:hover{
    background:#d0ffd0;
}
button{
    margin-top:15px;
    padding:10px 20px;
    font-size:16px;
}
#question-number{
    font-size:20px;
    margin-bottom:10px;
}
.warning-box{
    width:80%;
    max-width:700px;
    margin:20px auto;
    padding:15px;
    background:#fff3cd;
    border:2px solid #ffcc00;
    border-radius:8px;
    color:#664d03;
    font-size:20px;
    text-align:center;
}
</style>
</head>

<body>

<div id="start-container" style="text-align:center;margin-top:50px;">

<h1 id="test-title-heading"></h1>

<div class="warning-box">
    <strong>Advertencia:</strong> En caso de cambiar de pestaña, cerrar navegador o cambiar de aplicación se cancelará el avance y se reiniciará el test.
</div>

<h2>Ingresa tu primer nombre y primer apellido</h2>

<input 
    type="text" 
    id="student-name" 
    placeholder="Ejemplo: JUAN PEREZ" 
    style="padding:10px;font-size:18px;text-transform:uppercase;"
    oninput="
        this.value = this.value
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[^A-Za-z\s]/g, '')
            .toUpperCase();
    "
>
<br><br>
<button onclick="startQuiz()">Comenzar Test</button>
</div>

<div id="quiz-container">
<div id="question-number"></div>
<div class="question-container" id="question"></div>
<div id="question-image"></div>
<ul id="options"></ul>
<button id="next-question" onclick="loadNextQuestion()">Siguiente</button>
<button id="finish-test" onclick="finishTest()">Terminar Test</button>
</div>

<div id="result"></div>

<script>

let studentName="";
let currentQuestionIndex=0;
let score=0;
let testStarted=false;

const testTitle = "Inecuaciones de segundo grado";

document.title = testTitle;
document.getElementById("test-title-heading").textContent = testTitle;
const allQuestions = [
{
    pregunta: "Resuelve la inecuación cuadrática: \\(x^2 - 5x + 6 > 0\\)",
    imagen: "",
    opciones: [
        "\\(x < 2 \\text{ o } x > 3\\)",
        "\\(2 < x < 3\\)",
        "\\(x \\leq 2 \\text{ o } x \\geq 3\\)",
        "\\(x \\in [2, 3]\\)"
    ],
    respuestaCorrecta: "\\(x < 2 \\text{ o } x > 3\\)",
    formula: "Factoriza y analiza el signo en cada intervalo",
    explicacion: "Factorizando: \\((x-2)(x-3) > 0\\). Las raíces son \\(x=2\\) y \\(x=3\\). El producto es positivo cuando ambos factores tienen el mismo signo: \\(x < 2\\) (ambos negativos) o \\(x > 3\\) (ambos positivos). ✓"
},
{
    pregunta: "Resuelve la inecuación cuadrática: \\(x^2 - 4 \\leq 0\\)",
    imagen: "",
    opciones: [
        "\\(x < -2 \\text{ o } x > 2\\)",
        "\\(-2 \\leq x \\leq 2\\)",
        "\\(-2 < x < 2\\)",
        "\\(x \\leq -2 \\text{ o } x \\geq 2\\)"
    ],
    respuestaCorrecta: "\\(-2 \\leq x \\leq 2\\)",
    formula: "Factoriza: \\((x-2)(x+2) \\leq 0\\)",
    explicacion: "Factorizando: \\((x-2)(x+2) \\leq 0\\). Las raíces son \\(x = -2\\) y \\(x = 2\\). El producto es negativo (o cero) entre las raíces: \\(-2 \\leq x \\leq 2\\). ✓"
},
{
    pregunta: "Resuelve la inecuación cuadrática: \\(2x^2 - 8x + 6 < 0\\)",
    imagen: "",
    opciones: [
        "\\(x < 1 \\text{ o } x > 3\\)",
        "\\(1 < x < 3\\)",
        "\\(x \\leq 1 \\text{ o } x \\geq 3\\)",
        "\\(1 \\leq x \\leq 3\\)"
    ],
    respuestaCorrecta: "\\(1 < x < 3\\)",
    formula: "Factoriza: \\(2(x-1)(x-3) < 0\\)",
    explicacion: "Dividiendo entre 2: \\(x^2 - 4x + 3 < 0\\). Factorizando: \\((x-1)(x-3) < 0\\). El producto es negativo entre las raíces: \\(1 < x < 3\\). ✓"
},
{
    pregunta: "Resuelve la inecuación cuadrática: \\(x^2 + 2x - 8 \\geq 0\\)",
    imagen: "",
    opciones: [
        "\\(-4 \\leq x \\leq 2\\)",
        "\\(-4 < x < 2\\)",
        "\\(x \\leq -4 \\text{ o } x \\geq 2\\)",
        "\\(x < -4 \\text{ o } x > 2\\)"
    ],
    respuestaCorrecta: "\\(x \\leq -4 \\text{ o } x \\geq 2\\)",
    formula: "Factoriza: \\((x+4)(x-2) \\geq 0\\)",
    explicacion: "Factorizando: \\((x+4)(x-2) \\geq 0\\). Las raíces son \\(x=-4\\) y \\(x=2\\). El producto es positivo (o cero) fuera de las raíces: \\(x \\leq -4\\) o \\(x \\geq 2\\). ✓"
},
{
    pregunta: "Resuelve la inecuación cuadrática: \\(-x^2 + 6x - 9 > 0\\)",
    imagen: "",
    opciones: [
        "\\(x = 3\\)",
        "\\(x \\neq 3\\)",
        "\\(x \\in \\mathbb{R}\\)",
        "\\(\\emptyset\\) (conjunto vacío)"
    ],
    respuestaCorrecta: "\\(\\emptyset\\) (conjunto vacío)",
    formula: "\\(-(x-3)^2 > 0\\)",
    explicacion: "Factorizando: \\(-(x-3)^2 > 0\\). Como \\((x-3)^2 \\geq 0\\) para todo \\(x\\), se tiene que \\(-(x-3)^2 \\leq 0\\) siempre. Nunca es estrictamente positivo, por tanto no existe ningún \\(x\\) que satisfaga la inecuación. La solución es \\(\\emptyset\\)."
},
{
    pregunta: "Resuelve la inecuación racional: \\(\\dfrac{x^2 - 5x + 4}{x - 2} > 0\\)",
    imagen: "",
    opciones: [
        "\\(x \\in (1, 2) \\cup (4, +\\infty)\\)",
        "\\(x \\in (-\\infty, 1) \\cup (2, 4)\\)",
        "\\(x \\in (-\\infty, 1) \\cup (2, 4)\\)",
        "\\(x \\in (1, 2) \\cup (4, +\\infty)\\)"
    ],
    respuestaCorrecta: "\\(x \\in (1, 2) \\cup (4, +\\infty)\\)",
    formula: "Factoriza numerador y analiza signos por intervalos",
    explicacion: "Factorizando el numerador: \\(\\dfrac{(x-1)(x-4)}{x-2} > 0\\). Raíces: \\(x=1, 4\\); restricción: \\(x \\neq 2\\). Tabla de signos en intervalos: en \\((-\\infty,1)\\) el cociente es negativo; en \\((1,2)\\) es positivo ✓; en \\((2,4)\\) es negativo; en \\((4,+\\infty)\\) es positivo ✓. Solución: \\((1,2)\\cup(4,+\\infty)\\)."
},
{
    pregunta: "Resuelve la inecuación cuadrática: \\(x^2 - 3x - 10 < 0\\)",
    imagen: "",
    opciones: [
        "\\(x \\in (-2, 5)\\)",
        "\\(x \\in [-2, 5]\\)",
        "\\(x \\in (-\\infty, -2) \\cup (5, +\\infty)\\)",
        "\\(x \\in (-\\infty, -2] \\cup [5, +\\infty)\\)"
    ],
    respuestaCorrecta: "\\(x \\in (-2, 5)\\)",
    formula: "Factoriza: \\((x-5)(x+2) < 0\\)",
    explicacion: "Factorizando: \\((x+2)(x-5) < 0\\). Raíces: \\(x=-2\\) y \\(x=5\\). El producto es negativo entre las raíces: \\(x \\in (-2, 5)\\). ✓"
},
{
    pregunta: "Resuelve la inecuación racional: \\(\\dfrac{x^2 - 4}{x^2 - 1} \\leq 0\\)",
    imagen: "",
    opciones: [
        "\\(x \\in [-2, -1) \\cup (1, 2]\\)",
        "\\(x \\in (-2, -1) \\cup (1, 2)\\)",
        "\\(x \\in (-\\infty, -2] \\cup [-1, 1] \\cup [2, +\\infty)\\)",
        "\\(x \\in [-2, -1) \\cup (1, 2]\\)"
    ],
    respuestaCorrecta: "\\(x \\in [-2, -1) \\cup (1, 2]\\)",
    formula: "Factoriza: \\(\\dfrac{(x-2)(x+2)}{(x-1)(x+1)} \\leq 0\\)",
    explicacion: "Factorizando: \\(\\dfrac{(x+2)(x-2)}{(x+1)(x-1)} \\leq 0\\). Raíces del numerador: \\(x=\\pm 2\\); restricciones del denominador: \\(x \\neq \\pm 1\\). Tabla de signos: el cociente es negativo (o cero) en \\([-2,-1)\\cup(1,2]\\). Se incluyen \\(x=\\pm 2\\) pues anulan el numerador, pero se excluyen \\(x=\\pm 1\\). ✓"
},
{
    pregunta: "Resuelve la inecuación cuadrática: \\(3x^2 - 12x + 12 \\geq 0\\)",
    imagen: "",
    opciones: [
        "\\(x \\in (-\\infty,+\\infty)\\) ",
        "\\(x = 2\\)",
        "\\(x \\in (-\\infty, 2] \\cup [2, +\\infty)\\)",
        "\\(x \\neq 2\\)"
    ],
    respuestaCorrecta: "\\(x \\in (-\\infty,+\\infty)\\) ",
    formula: "\\(3(x-2)^2 \\geq 0\\)",
    explicacion: "Factorizando: \\(3(x-2)^2 \\geq 0\\). Como \\((x-2)^2 \\geq 0\\) para todo valor real de \\(x\\), la inecuación se cumple siempre. La solución es \\(x \\in \\mathbb{R}\\). \\(x \\in (-\\infty,+\\infty)\\)  ✓"
},
{
    pregunta: "Resuelve la inecuación racional: \\(\\dfrac{2x^2 - 5x + 2}{x - 3} < 0\\)",
    imagen: "",
    opciones: [
        "\\(x \\in \\left(\\frac{1}{2}, 1\\right) \\cup (3, +\\infty)\\)",
        "\\(x \\in \\left(-\\infty, \\frac{1}{2}\\right) \\cup (1, 3)\\)",
        "\\(x \\in \\left(\\frac{1}{2}, 1\\right) \\cup (3, +\\infty)\\)",
        "\\(x \\in \\left(-\\infty, \\frac{1}{2}\\right) \\cup (2, 3)\\)"
    ],
    respuestaCorrecta: "\\(x \\in \\left(-\\infty, \\frac{1}{2}\\right) \\cup (2, 3)\\)",
    formula: "Factoriza numerador: \\((2x-1)(x-2)\\)",
    explicacion: "Factorizando el numerador: \\(\\dfrac{(2x-1)(x-2)}{x-3} < 0\\). Raíces: \\(x=\\frac{1}{2}\\) y \\(x=2\\); restricción: \\(x \\neq 3\\). Tabla de signos: en \\((-\\infty, \\frac{1}{2})\\) el cociente es negativo ✓; en \\((\\frac{1}{2}, 2)\\) es positivo; en \\((2, 3)\\) es negativo ✓; en \\((3,+\\infty)\\) es positivo. Solución: \\(\\left(-\\infty, \\frac{1}{2}\\right) \\cup (2, 3)\\)."
},
];

const questions=[...allQuestions]
.sort(()=>0.5-Math.random())
.slice(0,10);

questions.forEach(q=>{
q.selectedAnswer=null;
q.opciones=[...q.opciones].sort(()=>0.5-Math.random());
});

function startQuiz(){
const name=document.getElementById("student-name").value.trim();
if(name===""){alert("Escribe tu nombre");return;}
studentName=name;
testStarted=true;
document.getElementById("start-container").style.display="none";
document.getElementById("quiz-container").style.display="block";
loadQuestion(currentQuestionIndex);
}

function loadQuestion(index){

const question=questions[index];
document.getElementById("question").innerHTML=question.pregunta;
document.getElementById("question-image").innerHTML="";

if(question.imagen){
const img=document.createElement("img");
img.src=question.imagen;
img.style.maxWidth="100%";
document.getElementById("question-image").appendChild(img);
}

document.getElementById("question-number").innerHTML=
`Pregunta ${index+1} de ${questions.length}`;

const optionsContainer=document.getElementById("options");
optionsContainer.innerHTML="";

question.opciones.forEach(option=>{
const li=document.createElement("li");
li.innerHTML=option;

li.onclick=()=>{
if(question.selectedAnswer!==null) return;

question.selectedAnswer=option;
li.style.backgroundColor="#66cc66";

document.getElementById("next-question").style.display=
index<questions.length-1?"inline-block":"none";

document.getElementById("finish-test").style.display=
index===questions.length-1?"inline-block":"none";
};

optionsContainer.appendChild(li);
});

document.getElementById("next-question").style.display="none";
document.getElementById("finish-test").style.display="none";

MathJax.typesetPromise();
}

function loadNextQuestion(){
currentQuestionIndex++;
loadQuestion(currentQuestionIndex);
}

function finishTest(){

score=0;

questions.forEach(q=>{
if(q.selectedAnswer===q.respuestaCorrecta){
score++;
}
});

const total=questions.length;
const errores=total-score;
const porcentaje=((score/total)*100).toFixed(2);

document.getElementById("quiz-container").style.display="none";

let html=`<h2>Resultado</h2>
<p>${studentName}, obtuviste <strong>${score}</strong> de ${total} (${porcentaje}%).</p>
<h3>Revisión:</h3>`;

questions.forEach(q=>{

let correcta=q.selectedAnswer===q.respuestaCorrecta;
let fondo=correcta?"#d4edda":"#f8d7da";
let borde=correcta?"#28a745":"#dc3545";
let icono=correcta?"✔ Correcta":"✘ Incorrecta";

html+=`
<div style="
background:${fondo};
border:2px solid ${borde};
margin:12px 0;
padding:16px;
border-radius:8px;
">
<strong>${icono}</strong><br><br>
<strong>Pregunta:</strong> ${q.pregunta}<br>
<strong>Tu respuesta:</strong> ${q.selectedAnswer || "No respondida"}<br>
<strong>Respuesta correcta:</strong> ${q.respuestaCorrecta}<br><br>
<strong>Explicación:</strong> ${q.explicacion}
</div>
`;
});

document.getElementById("result").innerHTML=html;
MathJax.typesetPromise();

const resumenPreguntas = questions.map((q, index) => {
    return {
        numero: index + 1,
        pregunta: q.pregunta,
        imagen: q.imagen || "",
        respuestaSeleccionada: q.selectedAnswer || "No respondida",
        respuestaCorrecta: q.respuestaCorrecta,
        formula: q.formula || "N/A",
        explicacion: q.explicacion || "N/A",
        resultado: q.selectedAnswer === q.respuestaCorrecta ? "Correcta" : "Incorrecta"
    };
});

fetch("https://script.google.com/macros/s/AKfycbxVg3d9f54YEtoiVBBv_OCZM-K7f5CpLKD8BDPFaDnW70whe_D2jsARIepNDxSxxa6I/exec",{
method:"POST",
body:JSON.stringify({
titulo:testTitle,
nombre:studentName,
aciertos:score,
errores:errores,
total:total,
porcentaje:porcentaje,
preguntas:resumenPreguntas
})
});
}

document.addEventListener("visibilitychange", function(){
    if(document.hidden && testStarted){
        location.reload();
    }
});

</script>
</body>
</html>
