<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title id="page-title"></title>


<script id="MathJax-script" async
src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.0/es5/tex-mml-chtml.js"></script>

<style>
body{
    background:#ccffcc;
    font-size:18px;
}
#quiz-container{
    width:95%;
    max-width:1200px;
    margin:auto;
    text-align:center;
    background:#fff;
    padding:20px;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    display:none;
}
.question-container,.option-container{
    background:#f0f0f0;
    border:1px solid #ddd;
    margin:10px 0;
    padding:16px;
    border-radius:5px;
}
#options{
    padding-left:0;
}
#options li{
    list-style:none;
    margin:5px 0;
    padding:15px;
    background:#e9ffe9;
    cursor:pointer;
    border-radius:5px;
}
#options li:hover{
    background:#d0ffd0;
}
button{
    margin-top:15px;
    padding:10px 20px;
    font-size:16px;
}
#question-number{
    font-size:20px;
    margin-bottom:10px;
}
.warning-box{
    width:80%;
    max-width:700px;
    margin:20px auto;
    padding:15px;
    background:#fff3cd;
    border:2px solid #ffcc00;
    border-radius:8px;
    color:#664d03;
    font-size:20px;
    text-align:center;
}
</style>
</head>

<body>

<div id="start-container" style="text-align:center;margin-top:50px;">

<h1 id="test-title-heading"></h1>

<div class="warning-box">
    <strong>Advertencia:</strong> En caso de cambiar de pestaña, cerrar navegador o cambiar de aplicación se cancelará el avance y se reiniciará el test.
</div>

<h2>Ingresa tu primer nombre y primer apellido</h2>

<input 
    type="text" 
    id="student-name" 
    placeholder="Ejemplo: JUAN PEREZ" 
    style="padding:10px;font-size:18px;text-transform:uppercase;"
    oninput="
        this.value = this.value
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[^A-Za-z\s]/g, '')
            .toUpperCase();
    "
>
<br><br>
<button onclick="startQuiz()">Comenzar Test</button>
</div>

<div id="quiz-container">
<div id="question-number"></div>
<div class="question-container" id="question"></div>
<div id="question-image"></div>
<ul id="options"></ul>
<button id="next-question" onclick="loadNextQuestion()">Siguiente</button>
<button id="finish-test" onclick="finishTest()">Terminar Test</button>
</div>

<div id="result"></div>

<script>

let studentName="";
let currentQuestionIndex=0;
let score=0;
let testStarted=false;

const testTitle = "Integrales por cambio de variable";

document.title = testTitle;
document.getElementById("test-title-heading").textContent = testTitle;
const allQuestions = [
    {
        pregunta: "Resuelve la integral: \\(\\displaystyle \\int \\sqrt{3x-1}\\,dx\\)",
        imagen: "",
        opciones: [
            "\\(\\dfrac{2}{9}(3x-1)^{3/2}+C\\)",
            "\\(\\dfrac{2}{3}(3x-1)^{3/2}+C\\)",
            "\\(\\dfrac{1}{9}(3x-1)^{3/2}+C\\)"
        ],
        respuestaCorrecta: "\\(\\dfrac{2}{9}(3x-1)^{3/2}+C\\)",
        formula: "\\(\\displaystyle \\int u^n\\,du=\\dfrac{u^{n+1}}{n+1}+C,\\quad n\\neq -1\\)",
        explicacion: "Reescribimos la raíz como potencia: \\(\\sqrt{3x-1}=(3x-1)^{1/2}\\). Hacemos la sustitución \\(u=3x-1\\), de donde \\(du=3\\,dx\\) y \\(dx=\\dfrac{du}{3}\\). Sustituyendo: \\(\\displaystyle \\int \\sqrt{3x-1}\\,dx=\\dfrac{1}{3}\\int u^{1/2}\\,du\\). Aplicamos la regla de la potencia: \\(\\dfrac{1}{3}\\cdot\\dfrac{u^{3/2}}{3/2}=\\dfrac{2}{9}u^{3/2}\\). Regresamos a la variable original: \\(\\boxed{\\dfrac{2}{9}(3x-1)^{3/2}+C}\\). ✓"
    },
    {
        pregunta: "Resuelve la integral: \\(\\displaystyle \\int \\sqrt{1-4y}\\,dy\\)",
        imagen: "",
        opciones: [
            "\\(\\dfrac{1}{6}(1-4y)^{3/2}+C\\)",
            "\\(-\\dfrac{1}{6}(1-4y)^{3/2}+C\\)",
            "\\(-\\dfrac{2}{3}(1-4y)^{3/2}+C\\)"
        ],
        respuestaCorrecta: "\\(-\\dfrac{1}{6}(1-4y)^{3/2}+C\\)",
        formula: "\\(\\displaystyle \\int u^n\\,du=\\dfrac{u^{n+1}}{n+1}+C,\\quad n\\neq -1\\)",
        explicacion: "Reescribimos la raíz: \\(\\sqrt{1-4y}=(1-4y)^{1/2}\\). Elegimos \\(u=1-4y\\), por lo que \\(du=-4\\,dy\\) y \\(dy=-\\dfrac{du}{4}\\). La integral se transforma en \\(\\displaystyle -\\dfrac{1}{4}\\int u^{1/2}\\,du\\). Integramos: \\(-\\dfrac{1}{4}\\cdot\\dfrac{u^{3/2}}{3/2}=-\\dfrac{1}{6}u^{3/2}\\). Sustituimos \\(u=1-4y\\): \\(\\boxed{-\\dfrac{1}{6}(1-4y)^{3/2}+C}\\). ✓"
    },
    {
        pregunta: "Resuelve la integral, considerando que \\(a\\) es constante: \\(\\displaystyle \\int x\\sqrt{a^2-x^2}\\,dx\\)",
        imagen: "",
        opciones: [
            "\\(\\dfrac{1}{3}(a^2-x^2)^{3/2}+C\\)",
            "\\(-\\dfrac{2}{3}(a^2-x^2)^{3/2}+C\\)",
            "\\(-\\dfrac{1}{3}(a^2-x^2)^{3/2}+C\\)"
        ],
        respuestaCorrecta: "\\(-\\dfrac{1}{3}(a^2-x^2)^{3/2}+C\\)",
        formula: "\\(\\displaystyle \\int u^n\\,du=\\dfrac{u^{n+1}}{n+1}+C,\\quad n\\neq -1\\)",
        explicacion: "Tomamos \\(u=a^2-x^2\\). Como \\(a\\) es constante, obtenemos \\(du=-2x\\,dx\\), así que \\(x\\,dx=-\\dfrac{du}{2}\\). Sustituimos: \\(\\displaystyle \\int x\\sqrt{a^2-x^2}\\,dx=-\\dfrac{1}{2}\\int u^{1/2}\\,du\\). Aplicando la regla de la potencia: \\(-\\dfrac{1}{2}\\cdot\\dfrac{u^{3/2}}{3/2}=-\\dfrac{1}{3}u^{3/2}\\). Regresamos a \\(x\\): \\(\\boxed{-\\dfrac{1}{3}(a^2-x^2)^{3/2}+C}\\). ✓"
    },
    {
        pregunta: "Resuelve la integral: \\(\\displaystyle \\int x^3\\sqrt{2+x^4}\\,dx\\)",
        imagen: "",
        opciones: [
            "\\(\\dfrac{1}{6}(2+x^4)^{3/2}+C\\)",
            "\\(\\dfrac{1}{4}(2+x^4)^{3/2}+C\\)",
            "\\(\\dfrac{2}{3}(2+x^4)^{3/2}+C\\)"
        ],
        respuestaCorrecta: "\\(\\dfrac{1}{6}(2+x^4)^{3/2}+C\\)",
        formula: "\\(\\displaystyle \\int u^n\\,du=\\dfrac{u^{n+1}}{n+1}+C,\\quad n\\neq -1\\)",
        explicacion: "Elegimos \\(u=2+x^4\\), cuya diferencial es \\(du=4x^3\\,dx\\). Despejamos \\(x^3\\,dx=\\dfrac{du}{4}\\). Entonces: \\(\\displaystyle \\int x^3\\sqrt{2+x^4}\\,dx=\\dfrac{1}{4}\\int u^{1/2}\\,du\\). Integramos: \\(\\dfrac{1}{4}\\cdot\\dfrac{u^{3/2}}{3/2}=\\dfrac{1}{6}u^{3/2}\\). Sustituyendo la expresión original: \\(\\boxed{\\dfrac{1}{6}(2+x^4)^{3/2}+C}\\). ✓"
    },
    {
        pregunta: "Resuelve la integral: \\(\\displaystyle \\int x^2(x^3-1)^{10}\\,dx\\)",
        imagen: "",
        opciones: [
            "\\(\\dfrac{1}{11}(x^3-1)^{11}+C\\)",
            "\\(\\dfrac{1}{33}(x^3-1)^{11}+C\\)",
            "\\(\\dfrac{1}{30}(x^3-1)^{11}+C\\)"
        ],
        respuestaCorrecta: "\\(\\dfrac{1}{33}(x^3-1)^{11}+C\\)",
        formula: "\\(\\displaystyle \\int u^n\\,du=\\dfrac{u^{n+1}}{n+1}+C,\\quad n\\neq -1\\)",
        explicacion: "Hacemos \\(u=x^3-1\\), por lo que \\(du=3x^2\\,dx\\) y \\(x^2\\,dx=\\dfrac{du}{3}\\). Sustituimos: \\(\\displaystyle \\int x^2(x^3-1)^{10}\\,dx=\\dfrac{1}{3}\\int u^{10}\\,du\\). Aumentamos el exponente en uno y dividimos entre el nuevo exponente: \\(\\dfrac{1}{3}\\cdot\\dfrac{u^{11}}{11}=\\dfrac{u^{11}}{33}\\). Regresando a \\(x\\): \\(\\boxed{\\dfrac{1}{33}(x^3-1)^{11}+C}\\). ✓"
    },
    {
        pregunta: "Resuelve la integral: \\(\\displaystyle \\int 2x^3\\sqrt{x^4+3}\\,dx\\)",
        imagen: "",
        opciones: [
            "\\(\\dfrac{2}{3}(x^4+3)^{3/2}+C\\)",
            "\\(\\dfrac{1}{6}(x^4+3)^{3/2}+C\\)",
            "\\(\\dfrac{1}{3}(x^4+3)^{3/2}+C\\)"
        ],
        respuestaCorrecta: "\\(\\dfrac{1}{3}(x^4+3)^{3/2}+C\\)",
        formula: "\\(\\displaystyle \\int u^n\\,du=\\dfrac{u^{n+1}}{n+1}+C,\\quad n\\neq -1\\)",
        explicacion: "Tomamos \\(u=x^4+3\\), de donde \\(du=4x^3\\,dx\\). Como la integral contiene \\(2x^3\\,dx\\), despejamos \\(2x^3\\,dx=\\dfrac{du}{2}\\). Así: \\(\\displaystyle \\int 2x^3\\sqrt{x^4+3}\\,dx=\\dfrac{1}{2}\\int u^{1/2}\\,du\\). Integramos: \\(\\dfrac{1}{2}\\cdot\\dfrac{u^{3/2}}{3/2}=\\dfrac{1}{3}u^{3/2}\\). Finalmente: \\(\\boxed{\\dfrac{1}{3}(x^4+3)^{3/2}+C}\\). ✓"
    }
];
const questions=[...allQuestions]
.sort(()=>0.5-Math.random())
.slice(0,3);

questions.forEach(q=>{
q.selectedAnswer=null;
q.opciones=[...q.opciones].sort(()=>0.5-Math.random());
});

function startQuiz(){
const name=document.getElementById("student-name").value.trim();
if(name===""){alert("Escribe tu nombre");return;}
studentName=name;
testStarted=true;
document.getElementById("start-container").style.display="none";
document.getElementById("quiz-container").style.display="block";
loadQuestion(currentQuestionIndex);
}

function loadQuestion(index){

const question=questions[index];
document.getElementById("question").innerHTML=question.pregunta;
document.getElementById("question-image").innerHTML="";

if(question.imagen){
const img=document.createElement("img");
img.src=question.imagen;
img.style.maxWidth="100%";
document.getElementById("question-image").appendChild(img);
}

document.getElementById("question-number").innerHTML=
`Pregunta ${index+1} de ${questions.length}`;

const optionsContainer=document.getElementById("options");
optionsContainer.innerHTML="";

question.opciones.forEach(option=>{
const li=document.createElement("li");
li.innerHTML=option;

li.onclick=()=>{
if(question.selectedAnswer!==null) return;

question.selectedAnswer=option;
li.style.backgroundColor="#66cc66";

document.getElementById("next-question").style.display=
index<questions.length-1?"inline-block":"none";

document.getElementById("finish-test").style.display=
index===questions.length-1?"inline-block":"none";
};

optionsContainer.appendChild(li);
});

document.getElementById("next-question").style.display="none";
document.getElementById("finish-test").style.display="none";

MathJax.typesetPromise();
}

function loadNextQuestion(){
currentQuestionIndex++;
loadQuestion(currentQuestionIndex);
}

function finishTest(){

score=0;

questions.forEach(q=>{
if(q.selectedAnswer===q.respuestaCorrecta){
score++;
}
});

const total=questions.length;
const errores=total-score;
const porcentaje=((score/total)*100).toFixed(2);

document.getElementById("quiz-container").style.display="none";

let html=`<h2>Resultado</h2>
<p>${studentName}, obtuviste <strong>${score}</strong> de ${total} (${porcentaje}%).</p>
<h3>Revisión:</h3>`;

questions.forEach(q=>{

let correcta=q.selectedAnswer===q.respuestaCorrecta;
let fondo=correcta?"#d4edda":"#f8d7da";
let borde=correcta?"#28a745":"#dc3545";
let icono=correcta?"✔ Correcta":"✘ Incorrecta";

html+=`
<div style="
background:${fondo};
border:2px solid ${borde};
margin:12px 0;
padding:16px;
border-radius:8px;
">
<strong>${icono}</strong><br><br>
<strong>Pregunta:</strong> ${q.pregunta}<br>
<strong>Tu respuesta:</strong> ${q.selectedAnswer || "No respondida"}<br>
<strong>Respuesta correcta:</strong> ${q.respuestaCorrecta}<br><br>
<strong>Explicación:</strong> ${q.explicacion}
</div>
`;
});

document.getElementById("result").innerHTML=html;
MathJax.typesetPromise();

const resumenPreguntas = questions.map((q, index) => {
    return {
        numero: index + 1,
        pregunta: q.pregunta,
        imagen: q.imagen || "",
        respuestaSeleccionada: q.selectedAnswer || "No respondida",
        respuestaCorrecta: q.respuestaCorrecta,
        formula: q.formula || "N/A",
        explicacion: q.explicacion || "N/A",
        resultado: q.selectedAnswer === q.respuestaCorrecta ? "Correcta" : "Incorrecta"
    };
});

fetch("https://script.google.com/macros/s/AKfycbxVg3d9f54YEtoiVBBv_OCZM-K7f5CpLKD8BDPFaDnW70whe_D2jsARIepNDxSxxa6I/exec",{
method:"POST",
body:JSON.stringify({
titulo:testTitle,
nombre:studentName,
aciertos:score,
errores:errores,
total:total,
porcentaje:porcentaje,
preguntas:resumenPreguntas
})
});
}

document.addEventListener("visibilitychange", function(){
    if(document.hidden && testStarted){
        location.reload();
    }
});

</script>
</body>
</html>
