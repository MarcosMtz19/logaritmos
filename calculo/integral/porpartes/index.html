<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title id="page-title"></title>


<script id="MathJax-script" async
src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.0/es5/tex-mml-chtml.js"></script>

<style>
body{
    background:#ccffcc;
    font-size:18px;
}
#quiz-container{
    width:95%;
    max-width:1200px;
    margin:auto;
    text-align:center;
    background:#fff;
    padding:20px;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    display:none;
}
.question-container,.option-container{
    background:#f0f0f0;
    border:1px solid #ddd;
    margin:10px 0;
    padding:16px;
    border-radius:5px;
}
#options{
    padding-left:0;
}
#options li{
    list-style:none;
    margin:5px 0;
    padding:15px;
    background:#e9ffe9;
    cursor:pointer;
    border-radius:5px;
}
#options li:hover{
    background:#d0ffd0;
}
button{
    margin-top:15px;
    padding:10px 20px;
    font-size:16px;
}
#question-number{
    font-size:20px;
    margin-bottom:10px;
}
.warning-box{
    width:80%;
    max-width:700px;
    margin:20px auto;
    padding:15px;
    background:#fff3cd;
    border:2px solid #ffcc00;
    border-radius:8px;
    color:#664d03;
    font-size:20px;
    text-align:center;
}
</style>
</head>

<body>

<div id="start-container" style="text-align:center;margin-top:50px;">

<h1 id="test-title-heading"></h1>

<div class="warning-box">
    <strong>Advertencia:</strong> En caso de cambiar de pestaña, cerrar navegador o cambiar de aplicación se cancelará el avance y se reiniciará el test.
</div>

<h2>Ingresa tu primer nombre y primer apellido</h2>

<input 
    type="text" 
    id="student-name" 
    placeholder="Ejemplo: JUAN PEREZ" 
    style="padding:10px;font-size:18px;text-transform:uppercase;"
    oninput="
        this.value = this.value
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[^A-Za-z\s]/g, '')
            .toUpperCase();
    "
>
<br><br>
<button onclick="startQuiz()">Comenzar Test</button>
</div>

<div id="quiz-container">
<div id="question-number"></div>
<div class="question-container" id="question"></div>
<div id="question-image"></div>
<ul id="options"></ul>
<button id="next-question" onclick="loadNextQuestion()">Siguiente</button>
<button id="finish-test" onclick="finishTest()">Terminar Test</button>
</div>

<div id="result"></div>

<script>

let studentName="";
let currentQuestionIndex=0;
let score=0;
let testStarted=false;

const testTitle = "Intagración por Partes";

document.title = testTitle;
document.getElementById("test-title-heading").textContent = testTitle;
const allQuestions = [
    {
        pregunta: "Resuelve la integral: \\(\\displaystyle \\int xe^x\\,dx\\)",
        imagen: "",
        opciones: [
            "\\(xe^x-e^x+C\\)",
            "\\(xe^x+e^x+C\\)",
            "\\(\\dfrac{x^2e^x}{2}+C\\)"
        ],
        respuestaCorrecta: "\\(xe^x-e^x+C\\)",
        formula: "\\(\\displaystyle \\int u\\,dv=uv-\\int v\\,du\\)",
        explicacion: "Aplicamos integración por partes. Elegimos \\(u=x\\) y \\(dv=e^x\\,dx\\), de donde \\(du=dx\\) y \\(v=e^x\\). Sustituimos en la fórmula: \\(\\displaystyle \\int xe^x\\,dx=xe^x-\\int e^x\\,dx\\). Integramos el término restante y obtenemos \\(\\boxed{xe^x-e^x+C}\\). ✓"
    },
    {
        pregunta: "Resuelve la integral: \\(\\displaystyle \\int x^2\\ln(x)\\,dx\\)",
        imagen: "",
        opciones: [
            "\\(\\dfrac{x^3}{3}\\ln(x)+\\dfrac{x^3}{9}+C\\)",
            "\\(\\dfrac{x^3}{3}\\ln(x)-\\dfrac{x^3}{9}+C\\)",
            "\\(\\dfrac{x^3}{3}\\ln(x)-\\dfrac{x^3}{3}+C\\)"
        ],
        respuestaCorrecta: "\\(\\dfrac{x^3}{3}\\ln(x)-\\dfrac{x^3}{9}+C\\)",
        formula: "\\(\\displaystyle \\int u\\,dv=uv-\\int v\\,du\\)",
        explicacion: "Elegimos \\(u=\\ln(x)\\) y \\(dv=x^2\\,dx\\). Entonces \\(du=\\dfrac{dx}{x}\\) y \\(v=\\dfrac{x^3}{3}\\). Aplicamos integración por partes: \\(\\displaystyle \\int x^2\\ln(x)\\,dx=\\dfrac{x^3}{3}\\ln(x)-\\int \\dfrac{x^3}{3}\\cdot\\dfrac{1}{x}\\,dx\\). Simplificamos: \\(\\displaystyle \\dfrac{x^3}{3}\\ln(x)-\\dfrac{1}{3}\\int x^2\\,dx\\). El resultado es \\(\\boxed{\\dfrac{x^3}{3}\\ln(x)-\\dfrac{x^3}{9}+C}\\), con \\(x>0\\). ✓"
    },
    {
        pregunta: "Resuelve la integral: \\(\\displaystyle \\int \\dfrac{\\ln(y)}{y^3}\\,dy\\)",
        imagen: "",
        opciones: [
            "\\(-\\dfrac{\\ln(y)}{2y^2}+\\dfrac{1}{4y^2}+C\\)",
            "\\(\\dfrac{\\ln(y)}{2y^2}-\\dfrac{1}{4y^2}+C\\)",
            "\\(-\\dfrac{\\ln(y)}{2y^2}-\\dfrac{1}{4y^2}+C\\)"
        ],
        respuestaCorrecta: "\\(-\\dfrac{\\ln(y)}{2y^2}-\\dfrac{1}{4y^2}+C\\)",
        formula: "\\(\\displaystyle \\int u\\,dv=uv-\\int v\\,du\\)",
        explicacion: "Reescribimos el integrando como \\(\\ln(y)y^{-3}\\). Elegimos \\(u=\\ln(y)\\) y \\(dv=y^{-3}\\,dy\\). Obtenemos \\(du=\\dfrac{dy}{y}\\) y \\(v=-\\dfrac{1}{2y^2}\\). Aplicamos la fórmula: \\(\\displaystyle \\int \\dfrac{\\ln(y)}{y^3}\\,dy=-\\dfrac{\\ln(y)}{2y^2}+\\dfrac{1}{2}\\int y^{-3}\\,dy\\). Como \\(\\displaystyle \\int y^{-3}\\,dy=-\\dfrac{1}{2y^2}\\), resulta \\(\\boxed{-\\dfrac{\\ln(y)}{2y^2}-\\dfrac{1}{4y^2}+C}\\), con \\(y>0\\). ✓"
    },
    {
        pregunta: "Resuelve la integral: \\(\\displaystyle \\int \\dfrac{\\ln(u)}{\\sqrt{u}}\\,du\\)",
        imagen: "",
        opciones: [
            "\\(2\\sqrt{u}\\ln(u)-4\\sqrt{u}+C\\)",
            "\\(2\\sqrt{u}\\ln(u)-2\\sqrt{u}+C\\)",
            "\\(2\\sqrt{u}\\ln(u)+4\\sqrt{u}+C\\)"
        ],
        respuestaCorrecta: "\\(2\\sqrt{u}\\ln(u)-4\\sqrt{u}+C\\)",
        formula: "\\(\\displaystyle \\int f\\,dg=fg-\\int g\\,df\\)",
        explicacion: "Para evitar confundir la variable \\(u\\) con los nombres de la fórmula, usamos \\(f\\) y \\(g\\). Elegimos \\(f=\\ln(u)\\) y \\(dg=u^{-1/2}\\,du\\). Entonces \\(df=\\dfrac{du}{u}\\) y \\(g=2\\sqrt{u}\\). Sustituimos: \\(\\displaystyle \\int \\dfrac{\\ln(u)}{\\sqrt{u}}\\,du=2\\sqrt{u}\\ln(u)-\\int 2\\sqrt{u}\\cdot\\dfrac{1}{u}\\,du\\). Simplificamos \\(\\dfrac{\\sqrt{u}}{u}=u^{-1/2}\\), por lo que queda \\(\\displaystyle 2\\sqrt{u}\\ln(u)-2\\int u^{-1/2}\\,du\\). Finalmente: \\(\\boxed{2\\sqrt{u}\\ln(u)-4\\sqrt{u}+C}\\), con \\(u>0\\). ✓"
    },
    {
        pregunta: "Resuelve la integral: \\(\\displaystyle \\int t\\sin(t)\\,dt\\)",
        imagen: "",
        opciones: [
            "\\(t\\cos(t)-\\sin(t)+C\\)",
            "\\(-t\\cos(t)+\\sin(t)+C\\)",
            "\\(-t\\cos(t)-\\sin(t)+C\\)"
        ],
        respuestaCorrecta: "\\(-t\\cos(t)+\\sin(t)+C\\)",
        formula: "\\(\\displaystyle \\int u\\,dv=uv-\\int v\\,du\\)",
        explicacion: "Elegimos \\(u=t\\) y \\(dv=\\sin(t)\\,dt\\). Derivamos e integramos, respectivamente: \\(du=dt\\) y \\(v=-\\cos(t)\\). Aplicamos integración por partes: \\(\\displaystyle \\int t\\sin(t)\\,dt=-t\\cos(t)-\\int (-\\cos(t))\\,dt\\). Simplificamos los signos: \\(\\displaystyle -t\\cos(t)+\\int \\cos(t)\\,dt\\). El resultado es \\(\\boxed{-t\\cos(t)+\\sin(t)+C}\\). ✓"
    },
    {
        pregunta: "Resuelve la integral: \\(\\displaystyle \\int x\\cos(2x)\\,dx\\)",
        imagen: "",
        opciones: [
            "\\(\\dfrac{x\\sin(2x)}{2}-\\dfrac{\\cos(2x)}{4}+C\\)",
            "\\(x\\sin(2x)+\\dfrac{\\cos(2x)}{2}+C\\)",
            "\\(\\dfrac{x\\sin(2x)}{2}+\\dfrac{\\cos(2x)}{4}+C\\)"
        ],
        respuestaCorrecta: "\\(\\dfrac{x\\sin(2x)}{2}+\\dfrac{\\cos(2x)}{4}+C\\)",
        formula: "\\(\\displaystyle \\int u\\,dv=uv-\\int v\\,du;\\qquad \\int \\cos(kx)\\,dx=\\dfrac{\\sin(kx)}{k}+C,\\quad k\\neq 0\\)",
        explicacion: "Elegimos \\(u=x\\) y \\(dv=\\cos(2x)\\,dx\\). Entonces \\(du=dx\\) y \\(v=\\dfrac{\\sin(2x)}{2}\\). Aplicamos la fórmula: \\(\\displaystyle \\int x\\cos(2x)\\,dx=\\dfrac{x\\sin(2x)}{2}-\\dfrac{1}{2}\\int \\sin(2x)\\,dx\\). Como \\(\\displaystyle \\int \\sin(2x)\\,dx=-\\dfrac{\\cos(2x)}{2}\\), obtenemos \\(\\dfrac{x\\sin(2x)}{2}-\\dfrac{1}{2}(-\\dfrac{\\cos(2x)}{2})+C\\). Finalmente: \\(\\boxed{\\dfrac{x\\sin(2x)}{2}+\\dfrac{\\cos(2x)}{4}+C}\\). ✓"
    },
    {
        pregunta: "Resuelve la integral, considerando que \\(a\\) es una constante distinta de cero: \\(\\displaystyle \\int x\\sin(ax)\\,dx\\)",
        imagen: "",
        opciones: [
            "\\(-\\dfrac{x\\cos(ax)}{a}+\\dfrac{\\sin(ax)}{a^2}+C\\)",
            "\\(-\\dfrac{x\\cos(ax)}{a}-\\dfrac{\\sin(ax)}{a^2}+C\\)",
            "\\(-\\dfrac{x\\cos(ax)}{a}+\\dfrac{\\sin(ax)}{a}+C\\)"
        ],
        respuestaCorrecta: "\\(-\\dfrac{x\\cos(ax)}{a}+\\dfrac{\\sin(ax)}{a^2}+C\\)",
        formula: "\\(\\displaystyle \\int u\\,dv=uv-\\int v\\,du;\\qquad \\int \\sin(ax)\\,dx=-\\dfrac{\\cos(ax)}{a}+C,\\quad a\\neq 0\\)",
        explicacion: "Elegimos \\(u=x\\) y \\(dv=\\sin(ax)\\,dx\\). Obtenemos \\(du=dx\\) y \\(v=-\\dfrac{\\cos(ax)}{a}\\). Aplicamos integración por partes: \\(\\displaystyle \\int x\\sin(ax)\\,dx=-\\dfrac{x\\cos(ax)}{a}+\\dfrac{1}{a}\\int \\cos(ax)\\,dx\\). Como \\(\\displaystyle \\int \\cos(ax)\\,dx=\\dfrac{\\sin(ax)}{a}\\), resulta \\(\\boxed{-\\dfrac{x\\cos(ax)}{a}+\\dfrac{\\sin(ax)}{a^2}+C}\\). ✓"
    },
    {
        pregunta: "Resuelve la integral: \\(\\displaystyle \\int z\\sec(z)\\tan(z)\\,dz\\)",
        imagen: "",
        opciones: [
            "\\(z\\sec(z)+\\ln|\\sec(z)+\\tan(z)|+C\\)",
            "\\(z\\tan(z)-\\ln|\\sec(z)+\\tan(z)|+C\\)",
            "\\(z\\sec(z)-\\ln|\\sec(z)+\\tan(z)|+C\\)"
        ],
        respuestaCorrecta: "\\(z\\sec(z)-\\ln|\\sec(z)+\\tan(z)|+C\\)",
        formula: "\\(\\displaystyle \\int u\\,dv=uv-\\int v\\,du;\\qquad \\int \\sec(z)\\tan(z)\\,dz=\\sec(z)+C;\\qquad \\int \\sec(z)\\,dz=\\ln|\\sec(z)+\\tan(z)|+C\\)",
        explicacion: "Elegimos \\(u=z\\) y \\(dv=\\sec(z)\\tan(z)\\,dz\\). Entonces \\(du=dz\\) y \\(v=\\sec(z)\\), porque la derivada de la secante es \\(\\sec(z)\\tan(z)\\). Aplicamos la fórmula: \\(\\displaystyle \\int z\\sec(z)\\tan(z)\\,dz=z\\sec(z)-\\int \\sec(z)\\,dz\\). Usamos la integral de la secante: \\(\\displaystyle \\int \\sec(z)\\,dz=\\ln|\\sec(z)+\\tan(z)|+C\\). Finalmente: \\(\\boxed{z\\sec(z)-\\ln|\\sec(z)+\\tan(z)|+C}\\). ✓"
    }
];

const questions=[...allQuestions]
.sort(()=>0.5-Math.random())
.slice(0,3);

questions.forEach(q=>{
q.selectedAnswer=null;
q.opciones=[...q.opciones].sort(()=>0.5-Math.random());
});

function startQuiz(){
const name=document.getElementById("student-name").value.trim();
if(name===""){alert("Escribe tu nombre");return;}
studentName=name;
testStarted=true;
document.getElementById("start-container").style.display="none";
document.getElementById("quiz-container").style.display="block";
loadQuestion(currentQuestionIndex);
}

function loadQuestion(index){

const question=questions[index];
document.getElementById("question").innerHTML=question.pregunta;
document.getElementById("question-image").innerHTML="";

if(question.imagen){
const img=document.createElement("img");
img.src=question.imagen;
img.style.maxWidth="100%";
document.getElementById("question-image").appendChild(img);
}

document.getElementById("question-number").innerHTML=
`Pregunta ${index+1} de ${questions.length}`;

const optionsContainer=document.getElementById("options");
optionsContainer.innerHTML="";

question.opciones.forEach(option=>{
const li=document.createElement("li");
li.innerHTML=option;

li.onclick=()=>{
// Guardamos la última respuesta seleccionada.
question.selectedAnswer=option;

// Quitamos el resaltado anterior para marcar solo la opción actual.
optionsContainer.querySelectorAll("li").forEach(item=>{
item.style.backgroundColor="";
});
li.style.backgroundColor="#66cc66";

document.getElementById("next-question").style.display=
index<questions.length-1?"inline-block":"none";

document.getElementById("finish-test").style.display=
index===questions.length-1?"inline-block":"none";
};

optionsContainer.appendChild(li);
});

document.getElementById("next-question").style.display="none";
document.getElementById("finish-test").style.display="none";

MathJax.typesetPromise();
}

function loadNextQuestion(){
currentQuestionIndex++;
loadQuestion(currentQuestionIndex);
}

function finishTest(){

score=0;

questions.forEach(q=>{
if(q.selectedAnswer===q.respuestaCorrecta){
score++;
}
});

const total=questions.length;
const errores=total-score;
const porcentaje=((score/total)*100).toFixed(2);

document.getElementById("quiz-container").style.display="none";

let html=`<h2>Resultado</h2>
<p>${studentName}, obtuviste <strong>${score}</strong> de ${total} (${porcentaje}%).</p>
<h3>Revisión:</h3>`;

questions.forEach(q=>{

let correcta=q.selectedAnswer===q.respuestaCorrecta;
let fondo=correcta?"#d4edda":"#f8d7da";
let borde=correcta?"#28a745":"#dc3545";
let icono=correcta?"✔ Correcta":"✘ Incorrecta";

html+=`
<div style="
background:${fondo};
border:2px solid ${borde};
margin:12px 0;
padding:16px;
border-radius:8px;
">
<strong>${icono}</strong><br><br>
<strong>Pregunta:</strong> ${q.pregunta}<br>
<strong>Tu respuesta:</strong> ${q.selectedAnswer || "No respondida"}<br>
<strong>Respuesta correcta:</strong> ${q.respuestaCorrecta}<br><br>
<strong>Explicación:</strong> ${q.explicacion}
</div>
`;
});

document.getElementById("result").innerHTML=html;
MathJax.typesetPromise();

const resumenPreguntas = questions.map((q, index) => {
    return {
        numero: index + 1,
        pregunta: q.pregunta,
        imagen: q.imagen || "",
        respuestaSeleccionada: q.selectedAnswer || "No respondida",
        respuestaCorrecta: q.respuestaCorrecta,
        formula: q.formula || "N/A",
        explicacion: q.explicacion || "N/A",
        resultado: q.selectedAnswer === q.respuestaCorrecta ? "Correcta" : "Incorrecta"
    };
});

fetch("https://script.google.com/macros/s/AKfycbzOKB58r0TLy1oxfovid9iantpOAYAXvaH1vkswJaBjIMwkX_Q4G6fm-bdxr5Myoq3Z/exec",{
method:"POST",
body:JSON.stringify({
titulo:testTitle,
nombre:studentName,
aciertos:score,
errores:errores,
total:total,
porcentaje:porcentaje,
preguntas:resumenPreguntas
})
});
}

document.addEventListener("visibilitychange", function(){
    if(document.hidden && testStarted){
        location.reload();
    }
});

</script>
</body>
</html>
