<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title id="page-title"></title>


<script id="MathJax-script" async
src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.0/es5/tex-mml-chtml.js"></script>

<style>
body{
    background:#ccffcc;
    font-size:18px;
}
#quiz-container{
    width:95%;
    max-width:1200px;
    margin:auto;
    text-align:center;
    background:#fff;
    padding:20px;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    display:none;
}
.question-container,.option-container{
    background:#f0f0f0;
    border:1px solid #ddd;
    margin:10px 0;
    padding:16px;
    border-radius:5px;
}
#options{
    padding-left:0;
}
#options li{
    list-style:none;
    margin:5px 0;
    padding:15px;
    background:#e9ffe9;
    cursor:pointer;
    border-radius:5px;
}
#options li:hover{
    background:#d0ffd0;
}
button{
    margin-top:15px;
    padding:10px 20px;
    font-size:16px;
}
#question-number{
    font-size:20px;
    margin-bottom:10px;
}
.warning-box{
    width:80%;
    max-width:700px;
    margin:20px auto;
    padding:15px;
    background:#fff3cd;
    border:2px solid #ffcc00;
    border-radius:8px;
    color:#664d03;
    font-size:20px;
    text-align:center;
}
</style>
</head>

<body>

<div id="start-container" style="text-align:center;margin-top:50px;">

<h1 id="test-title-heading"></h1>

<div class="warning-box">
    <strong>Advertencia:</strong> En caso de cambiar de pestaña, cerrar navegador o cambiar de aplicación se cancelará el avance y se reiniciará el test.
</div>

<h2>Ingresa tu primer nombre y primer apellido</h2>

<input 
    type="text" 
    id="student-name" 
    placeholder="Ejemplo: JUAN PEREZ" 
    style="padding:10px;font-size:18px;text-transform:uppercase;"
    oninput="
        this.value = this.value
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[^A-Za-z\s]/g, '')
            .toUpperCase();
    "
>
<br><br>
<button onclick="startQuiz()">Comenzar Test</button>
</div>

<div id="quiz-container">
<div id="question-number"></div>
<div class="question-container" id="question"></div>
<div id="question-image"></div>
<ul id="options"></ul>
<button id="next-question" onclick="loadNextQuestion()">Siguiente</button>
<button id="finish-test" onclick="finishTest()">Terminar Test</button>
</div>

<div id="result"></div>

<script>

let studentName="";
let currentQuestionIndex=0;
let score=0;
let testStarted=false;

const testTitle = "Rectas paralelas cortadas por una secante";

document.title = testTitle;
document.getElementById("test-title-heading").textContent = testTitle;
const allQuestions = [
    {
        pregunta: "¿Cuál es el valor de x de la siguiente figura?",
        imagen: "https://i.imgur.com/Ro1W6AE.png",
        opciones: [
            "\\(x=511.1 m\\)",
            "\\(x=500.1 m\\)",
            "\\(x=510.1 m\\)"
        ],
        respuestaCorrecta: "\\(x=511.1 m\\)",
        formula: "N/A",
        explicacion: "Identificamos que \\(x\\) es el lado adyacente al ángulo de 37° y la hipotenusa mide 640 m. Aplicando razón trigonométrica coseno: \\(\\cos(37°) = \\dfrac{x}{640}\\). Despejando: \\(x = 640 \\cdot \\cos(37°) \\approx 640 \\times 0.7986 \\approx 511.1 \\text{ m}\\). ✓"
    },
    {
        pregunta: "Determina el valor de 'x'",
        imagen: "https://i.imgur.com/igN9V1y.png",
        opciones: [
        "\\(x = 25 \\text{ m}\\)",
        "\\(x = 43.3 \\text{ m}\\)",
        "\\(x = 28.9 \\text{ m}\\)"
        ],
        respuestaCorrecta: "\\(x = 25 \\text{ m}\\)",
        formula: "N/A",
        explicacion: "Identificamos que \\(x\\) es el lado opuesto al ángulo de 30° y la hipotenusa mide 50 m. Aplicando razón trigonométrica seno: \\(\\sin(30°) = \\dfrac{x}{50}\\). Despejando: \\(x = 50 \\cdot \\sin(30°) = 50 \\times 0.5 = 25 \\text{ m}\\). ✓"
    },
    {
        pregunta: "De  la siguiente figura ¿cuál es el valor de x ",
        imagen: "https://i.imgur.com/NLyuJII.png",
        opciones: [
        "\\(x = 16.97 \\text{ m}\\)",
        "\\(x = 20.78 \\text{ m}\\)",
        "\\(x = 13.86 \\text{ m}\\)"
        ],
        respuestaCorrecta: "\\(x = 16.97 \\text{ m}\\)",
        formula: "\\(\\cos(\\theta) = \\dfrac{\\text{adyacente}}{\\text{hipotenusa}}\\)",
        explicacion: "Identificamos que \\(x\\) es el lado adyacente al ángulo de 45° y la hipotenusa mide 24 m. Aplicando razón trigonométrica coseno: \\(\\cos(45°) = \\dfrac{x}{24}\\). Despejando: \\(x = 24 \\cdot \\cos(45°) \\approx 24 \\times 0.7071 \\approx 16.97 \\text{ m}\\). ✓"
    },
    {
        pregunta: "Resuelve respecto al ángulo \\(\\alpha\\)",
        imagen: "https://i.imgur.com/xYlVBe9.png",
        opciones:  [
        "\\(\\sin\\alpha = \\dfrac{9.2}{11.87},\\; \\cos\\alpha = \\dfrac{7.5}{11.87},\\; \\tan\\alpha = \\dfrac{9.2}{7.5}\\)",
         "\\(\\sin\\alpha = \\dfrac{7.5}{11.87},\\; \\cos\\alpha = \\dfrac{9.2}{11.87},\\; \\tan\\alpha = \\dfrac{7.5}{9.2}\\)",
        "\\(\\sin\\alpha = \\dfrac{7.5}{9.2},\\; \\cos\\alpha = \\dfrac{9.2}{7.5},\\; \\tan\\alpha = \\dfrac{11.87}{9.2}\\)"
        ],
        respuestaCorrecta: "\\(\\sin\\alpha = \\dfrac{9.2}{11.87},\\; \\cos\\alpha = \\dfrac{7.5}{11.87},\\; \\tan\\alpha = \\dfrac{9.2}{7.5}\\)",
        formula: "\\(\\sin\\theta = \\dfrac{\\text{opuesto}}{\\text{hipotenusa}},\\quad \\cos\\theta = \\dfrac{\\text{adyacente}}{\\text{hipotenusa}},\\quad \\tan\\theta = \\dfrac{\\text{opuesto}}{\\text{adyacente}}\\)",
        explicacion: "Calculamos la hipotenusa: \\(a = \\sqrt{9.2^2 + 7.5^2} = \\sqrt{140.89} \\approx 11.87 \\text{ cm}\\). Para el ángulo \\(\\alpha\\): el lado opuesto es \\(b = 9.2\\) cm y el adyacente es \\(c = 7.5\\) cm. Entonces: \\(\\sin\\alpha = \\dfrac{9.2}{11.87} \\approx 0.775\\), \\(\\cos\\alpha = \\dfrac{7.5}{11.87} \\approx 0.632\\), \\(\\tan\\alpha = \\dfrac{9.2}{7.5} \\approx 1.227\\). ✓"
    },
    {
        pregunta: "Resuelve respecto a \\(\\alpha\\)",
        imagen: "https://i.imgur.com/cZJJVjE.png",
        opciones: [
        "\\(\\sin\\alpha = \\dfrac{3}{5},\\; \\cos\\alpha = \\dfrac{4}{5},\\; \\tan\\alpha = \\dfrac{3}{4}\\)",
        "\\(\\sin\\alpha = \\dfrac{4}{5},\\; \\cos\\alpha = \\dfrac{3}{5},\\; \\tan\\alpha = \\dfrac{4}{3}\\)",
        "\\(\\sin\\alpha = \\dfrac{3}{4},\\; \\cos\\alpha = \\dfrac{4}{3},\\; \\tan\\alpha = \\dfrac{5}{3}\\)"
        ],
        respuestaCorrecta: "\\(\\sin\\alpha = \\dfrac{3}{5},\\; \\cos\\alpha = \\dfrac{4}{5},\\; \\tan\\alpha = \\dfrac{3}{4}\\)",
        formula: "\\(\\sin\\theta = \\dfrac{\\text{opuesto}}{\\text{hipotenusa}},\\quad \\cos\\theta = \\dfrac{\\text{adyacente}}{\\text{hipotenusa}},\\quad \\tan\\theta = \\dfrac{\\text{opuesto}}{\\text{adyacente}}\\)",
        explicacion: "Calculamos el lado opuesto: \\(b = \\sqrt{5^2 - 4^2} = \\sqrt{9} = 3 \\text{ cm}\\). Para el ángulo \\(\\alpha\\): la hipotenusa es \\(a = 5\\), el lado opuesto es \\(b = 3\\) y el adyacente es \\(c = 4\\). Entonces: \\(\\sin\\alpha = \\dfrac{3}{5} = 0.6\\), \\(\\cos\\alpha = \\dfrac{4}{5} = 0.8\\), \\(\\tan\\alpha = \\dfrac{3}{4} = 0.75\\). ✓"
    },
    {
        pregunta: "Determina las razones trigonométricas respecto al ángulo \\(\\alpha\\)",
        imagen: "https://i.imgur.com/qfXtsc6.png",
        opciones:          [
        "\\(\\sin\\alpha = \\dfrac{\\sqrt{10}}{\\sqrt{15}},\\; \\cos\\alpha = \\dfrac{\\sqrt{5}}{\\sqrt{15}},\\; \\tan\\alpha = \\dfrac{\\sqrt{10}}{\\sqrt{5}}; \\\\ \\csc\\alpha = \\dfrac{\\sqrt{15}}{\\sqrt{10}},\\; \\sec\\alpha = \\dfrac{\\sqrt{15}}{\\sqrt{5}},\\; \\cot\\alpha = \\dfrac{\\sqrt{5}}{\\sqrt{10}}\\)",
        "\\(\\sin\\alpha = \\dfrac{\\sqrt{5}}{\\sqrt{15}},\\; \\cos\\alpha = \\dfrac{\\sqrt{10}}{\\sqrt{15}},\\; \\tan\\alpha = \\dfrac{\\sqrt{5}}{\\sqrt{10}}; \\\\ \\csc\\alpha = \\dfrac{\\sqrt{15}}{\\sqrt{5}},\\; \\sec\\alpha = \\dfrac{\\sqrt{15}}{\\sqrt{10}},\\; \\cot\\alpha = \\dfrac{\\sqrt{10}}{\\sqrt{5}}\\)",
        "\\(\\sin\\alpha = \\dfrac{\\sqrt{10}}{\\sqrt{5}},\\; \\cos\\alpha = \\dfrac{\\sqrt{5}}{\\sqrt{10}},\\; \\tan\\alpha = \\dfrac{\\sqrt{15}}{\\sqrt{10}}; \\\\ \\csc\\alpha = \\dfrac{\\sqrt{5}}{\\sqrt{15}},\\; \\sec\\alpha = \\dfrac{\\sqrt{10}}{\\sqrt{15}},\\; \\cot\\alpha = \\dfrac{\\sqrt{10}}{\\sqrt{15}}\\)"
        ],
        respuestaCorrecta: "\\(\\sin\\alpha = \\dfrac{\\sqrt{10}}{\\sqrt{15}},\\; \\cos\\alpha = \\dfrac{\\sqrt{5}}{\\sqrt{15}},\\; \\tan\\alpha = \\dfrac{\\sqrt{10}}{\\sqrt{5}} \\\\ \\csc\\alpha = \\dfrac{\\sqrt{15}}{\\sqrt{10}},\\; \\sec\\alpha = \\dfrac{\\sqrt{15}}{\\sqrt{5}},\\; \\cot\\alpha = \\dfrac{\\sqrt{5}}{\\sqrt{10}}\\)",
        formula: "\\(\\sin\\theta = \\dfrac{\\text{op}}{\\text{hip}},\\; \\cos\\theta = \\dfrac{\\text{ady}}{\\text{hip}},\\; \\tan\\theta = \\dfrac{\\text{op}}{\\text{ady}} \\\\ \\csc\\theta = \\dfrac{\\text{hip}}{\\text{op}},\\; \\sec\\theta = \\dfrac{\\text{hip}}{\\text{ady}},\\; \\cot\\theta = \\dfrac{\\text{ady}}{\\text{op}}\\)",
        explicacion: "Calculamos \\(c = \\sqrt{15 - 10} = \\sqrt{5} \\text{ cm}\\). Con hipotenusa \\(a = \\sqrt{15}\\), opuesto \\(b = \\sqrt{10}\\) y adyacente \\(c = \\sqrt{5}\\): \\(\\sin\\alpha = \\dfrac{\\sqrt{10}}{\\sqrt{15}}\\), \\(\\cos\\alpha = \\dfrac{\\sqrt{5}}{\\sqrt{15}}\\), \\(\\tan\\alpha = \\dfrac{\\sqrt{10}}{\\sqrt{5}} = \\sqrt{2}\\), \\(\\csc\\alpha = \\dfrac{\\sqrt{15}}{\\sqrt{10}}\\), \\(\\sec\\alpha = \\dfrac{\\sqrt{15}}{\\sqrt{5}} = \\sqrt{3}\\), \\(\\cot\\alpha = \\dfrac{\\sqrt{5}}{\\sqrt{10}} = \\dfrac{1}{\\sqrt{2}}\\). ✓"
    },
    
];

const questions=[...allQuestions]
.sort(()=>0.5-Math.random())
.slice(0,6);

questions.forEach(q=>{
q.selectedAnswer=null;
q.opciones=[...q.opciones].sort(()=>0.5-Math.random());
});

function startQuiz(){
const name=document.getElementById("student-name").value.trim();
if(name===""){alert("Escribe tu nombre");return;}
studentName=name;
testStarted=true;
document.getElementById("start-container").style.display="none";
document.getElementById("quiz-container").style.display="block";
loadQuestion(currentQuestionIndex);
}

function loadQuestion(index){

const question=questions[index];
document.getElementById("question").innerHTML=question.pregunta;
document.getElementById("question-image").innerHTML="";

if(question.imagen){
const img=document.createElement("img");
img.src=question.imagen;
img.style.maxWidth="100%";
document.getElementById("question-image").appendChild(img);
}

document.getElementById("question-number").innerHTML=
`Pregunta ${index+1} de ${questions.length}`;

const optionsContainer=document.getElementById("options");
optionsContainer.innerHTML="";

question.opciones.forEach(option=>{
const li=document.createElement("li");
li.innerHTML=option;

li.onclick=()=>{
if(question.selectedAnswer!==null) return;

question.selectedAnswer=option;
li.style.backgroundColor="#66cc66";

document.getElementById("next-question").style.display=
index<questions.length-1?"inline-block":"none";

document.getElementById("finish-test").style.display=
index===questions.length-1?"inline-block":"none";
};

optionsContainer.appendChild(li);
});

document.getElementById("next-question").style.display="none";
document.getElementById("finish-test").style.display="none";

MathJax.typesetPromise();
}

function loadNextQuestion(){
currentQuestionIndex++;
loadQuestion(currentQuestionIndex);
}

function finishTest(){

score=0;

questions.forEach(q=>{
if(q.selectedAnswer===q.respuestaCorrecta){
score++;
}
});

const total=questions.length;
const errores=total-score;
const porcentaje=((score/total)*100).toFixed(2);

document.getElementById("quiz-container").style.display="none";

let html=`<h2>Resultado</h2>
<p>${studentName}, obtuviste <strong>${score}</strong> de ${total} (${porcentaje}%).</p>
<h3>Revisión:</h3>`;

questions.forEach(q=>{

let correcta=q.selectedAnswer===q.respuestaCorrecta;
let fondo=correcta?"#d4edda":"#f8d7da";
let borde=correcta?"#28a745":"#dc3545";
let icono=correcta?"✔ Correcta":"✘ Incorrecta";

html+=`
<div style="
background:${fondo};
border:2px solid ${borde};
margin:12px 0;
padding:16px;
border-radius:8px;
">
<strong>${icono}</strong><br><br>
<strong>Pregunta:</strong> ${q.pregunta}<br>
<strong>Tu respuesta:</strong> ${q.selectedAnswer || "No respondida"}<br>
<strong>Respuesta correcta:</strong> ${q.respuestaCorrecta}<br><br>
<strong>Explicación:</strong> ${q.explicacion}
</div>
`;
});

document.getElementById("result").innerHTML=html;
MathJax.typesetPromise();

const resumenPreguntas = questions.map((q, index) => {
    return {
        numero: index + 1,
        pregunta: q.pregunta,
        imagen: q.imagen || "",
        respuestaSeleccionada: q.selectedAnswer || "No respondida",
        respuestaCorrecta: q.respuestaCorrecta,
        formula: q.formula || "N/A",
        explicacion: q.explicacion || "N/A",
        resultado: q.selectedAnswer === q.respuestaCorrecta ? "Correcta" : "Incorrecta"
    };
});

fetch("https://script.google.com/macros/s/AKfycbxVg3d9f54YEtoiVBBv_OCZM-K7f5CpLKD8BDPFaDnW70whe_D2jsARIepNDxSxxa6I/exec",{
method:"POST",
body:JSON.stringify({
titulo:testTitle,
nombre:studentName,
aciertos:score,
errores:errores,
total:total,
porcentaje:porcentaje,
preguntas:resumenPreguntas
})
});
}

document.addEventListener("visibilitychange", function(){
    if(document.hidden && testStarted){
        location.reload();
    }
});

</script>
</body>
</html>
