<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title id="page-title"></title>

<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async
src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.0/es5/tex-mml-chtml.js"></script>

<style>
body{
    background:#ccffcc;
    font-size:18px;
}
#quiz-container{
    width:80%;
    max-width:600px;
    margin:auto;
    text-align:center;
    background:#fff;
    padding:20px;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    display:none;
}
.question-container,.option-container{
    background:#f0f0f0;
    border:1px solid #ddd;
    margin:10px 0;
    padding:16px;
    border-radius:5px;
}
#options{
    padding-left:0;
}
#options li{
    list-style:none;
    margin:5px 0;
    padding:15px;
    background:#e9ffe9;
    cursor:pointer;
    border-radius:5px;
}
#options li:hover{
    background:#d0ffd0;
}
button{
    margin-top:15px;
    padding:10px 20px;
    font-size:16px;
}
#question-number{
    font-size:20px;
    margin-bottom:10px;
}
.warning-box{
    width:80%;
    max-width:700px;
    margin:20px auto;
    padding:15px;
    background:#fff3cd;
    border:2px solid #ffcc00;
    border-radius:8px;
    color:#664d03;
    font-size:20px;
    text-align:center;
}
</style>
</head>

<body>

<div id="start-container" style="text-align:center;margin-top:50px;">

<h1 id="test-title-heading"></h1>

<div class="warning-box">
    <strong>Advertencia:</strong> En caso de cambiar de pestaña, cerrar navegador o cambiar de aplicación se cancelará el avance y se reiniciará el test.
</div>

<h2>Ingresa tu primer nombre y primer apellido</h2>

<input 
    type="text" 
    id="student-name" 
    placeholder="Ejemplo: JUAN PEREZ" 
    style="padding:10px;font-size:18px;text-transform:uppercase;"
    oninput="
        this.value = this.value
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[^A-Za-z\s]/g, '')
            .toUpperCase();
    "
>
<br><br>
<button onclick="startQuiz()">Comenzar Test</button>
</div>

<div id="quiz-container">
<div id="question-number"></div>
<div class="question-container" id="question"></div>
<div id="question-image"></div>
<ul id="options"></ul>
<button id="next-question" onclick="loadNextQuestion()">Siguiente</button>
<button id="finish-test" onclick="finishTest()">Terminar Test</button>
</div>

<div id="result"></div>

<script>

let studentName="";
let currentQuestionIndex=0;
let score=0;
let testStarted=false;

const testTitle = "Ecuaciones Logarítmicas";

document.title = testTitle;
document.getElementById("test-title-heading").textContent = testTitle;
const allQuestions = [
{
    pregunta: "Resuelve: \\(\\log_2(x^2 - 5x + 6) = 2\\)",
    imagen: "",
    opciones: [
        "\\(x = \\frac{5+\\sqrt{17}}{2}=4.5615\\) o \\(x = \\frac{5-\\sqrt{17}}{2}=0.4384\\)",
        "\\(x = -2\\) o \\(x = 7\\)",
        "\\(x = 7\\)"
    ],
    respuestaCorrecta: "\\(x = \\frac{5+\\sqrt{17}}{2}=4.5615\\) o \\(x = \\frac{5-\\sqrt{17}}{2}=0.4384\\)",
    formula: "\\(\\log_b(x) = n \\Leftrightarrow b^n = x\\)",
    explicacion: "Se llega a una ecuación de segundo grado en donde se tiene que resolver por formula general"
    },
{
    pregunta: "Resuelve: \\(\\log_3(x) + \\log_3(x-2) = 1\\)",
    imagen: "",
    opciones: [
        "\\(x = -3\\)",
        "\\(x = -1\\) o \\(x = 3\\)",
        "\\(x = 3\\) (\\(x = -1\\) no es válida)"
    ],
    respuestaCorrecta: "\\(x = 3\\) (\\(x = -1\\) no es válida)",
    formula: "\\(\\log_b(M) + \\log_b(N) = \\log_b(MN)\\)",
    explicacion: "Por propiedad: \\(\\log_3(x(x-2)) = 1 \\Rightarrow x(x-2) = 3\\). Expandiendo: \\(x^2 - 2x - 3 = 0 \\Rightarrow (x-3)(x+1) = 0\\). Las raíces son \\(x = 3\\) y \\(x = -1\\). Como \\(x > 0\\) y \\(x > 2\\) (dominio del logaritmo), \\(x = -1\\) no es válida. Solo \\(x = 3\\)."
},
{
    pregunta: "Resuelve: \\(\\log_5(x) - \\log_5(x+4) = 1\\)",
    imagen: "",
    opciones: [
        "Sin solución",
        "\\(x = 25\\)",
        "\\(x = 25\\) (\\(x = -1\\) no es válida)"
    ],
    respuestaCorrecta: "Sin solución",
    formula: "\\(n\\log_b(x) = \\log_b(x^n)\\) y \\(\\log_b(M)-\\log_b(N)=\\log_b\\!\\left(\\frac{M}{N}\\right)\\)",
    explicacion: "No hay solución para x que satisfaga la ecuación"
},
{
    pregunta: "Resuelve: \\(\\log_2(x+3) - \\log_2(x-1) = 2\\)",
    imagen: "",
    opciones: [
        "\\(x = \\dfrac{5}{3}\\)",
        "\\(x = \\dfrac{7}{3}\\)",
        "\\(x = \\dfrac{11}{3}\\)"
    ],
    respuestaCorrecta: "\\(x = \\dfrac{7}{3}\\)",
    formula: "\\(\\log_b(M)-\\log_b(N)=\\log_b\\!\\left(\\frac{M}{N}\\right)\\)",
    explicacion: "\\(\\log_2\\!\\left(\\frac{x+3}{x-1}\\right) = 2 \\Rightarrow \\frac{x+3}{x-1} = 4\\). Entonces \\(x+3 = 4(x-1) = 4x-4 \\Rightarrow 7 = 3x \\Rightarrow x = \\frac{7}{3}\\). Verificación: \\(x - 1 = \\frac{4}{3} > 0\\). ✓"
},
{
    pregunta: "Resuelve: \\(\\log_x(8) + \\log_x(2) = 2\\)",
    imagen: "",
    opciones: [
        "\\(x = 2\\)",
        "\\(x = 4\\)",
        "\\(x = \\sqrt{2}\\)"
    ],
    respuestaCorrecta: "\\(x = 4\\)",
    formula: "\\(\\log_b(M) + \\log_b(N) = \\log_b(MN)\\)",
    explicacion: "Usando propiedad: \\(\\log_x(8 \\cdot 2) = 2 \\Rightarrow \\log_x(16) = 2 \\Rightarrow x^2 = 16 \\Rightarrow x = 4\\) (se descarta \\(x = -4\\) por ser base negativa)."
},
{
    pregunta: "Resuelve: \\(3\\log(x) - \\log(x^2) = \\log(100)\\)",
    imagen: "",
    opciones: [
        "\\(x = 10\\)",
        "\\(x = 100\\)",
        "\\(x = 1\\)"
    ],
    respuestaCorrecta: "\\(x = 100\\)",
    formula: "\\(n\\log(x) = \\log(x^n)\\) y \\(\\log(M) - \\log(N) = \\log\\!\\left(\\frac{M}{N}\\right)\\)",
    explicacion: "Simplificando: \\(\\log(x^3) - \\log(x^2) = \\log(100) \\Rightarrow \\log\\!\\left(\\frac{x^3}{x^2}\\right) = \\log(100) \\Rightarrow \\log(x) = \\log(100)\\). Por tanto \\(x = 100\\)."
},
{
    pregunta: "Resuelve: \\(\\log_2(2x-1) + \\log_2(x) = 2\\)",
    imagen: "",
    opciones: [
        "\\(x = \\frac{1+\\sqrt{33}}{4}=1.6861\\)",
        "\\(x = \\frac{1-\\sqrt{33}}{4}=-0.18301\\)",
        "\\(x = 2\\)"
    ],
    respuestaCorrecta: "\\(x = \\frac{1+\\sqrt{33}}{4}=1.6861\\)",
    formula: "\\(\\log_b(M) + \\log_b(N) = \\log_b(MN)\\)",
    explicacion: "Se llega a una ecuación de segundo grado en donde se tiene que resolver por formula general"
},
{
    pregunta: "Resuelve: \\(\\ln(x^2 - 1) - \\ln(x+1) = \\ln(3)\\)",
    imagen: "",
    opciones: [
        "\\(x = -4\\)",
        "\\(x = -4\\) o \\(x = 4\\)",
        "\\(x = 4\\) (\\(x = -4\\) no es válida)"
    ],
    respuestaCorrecta: "\\(x = 4\\) (\\(x = -4\\) no es válida)",
    formula: "\\(\\ln(M) - \\ln(N) = \\ln\\!\\left(\\frac{M}{N}\\right)\\) y \\(x^2-1=(x+1)(x-1)\\)",
    explicacion: "\\(\\ln\\!\\left(\\frac{x^2-1}{x+1}\\right) = \\ln(3) \\Rightarrow \\frac{(x+1)(x-1)}{x+1} = 3 \\Rightarrow x - 1 = 3 \\Rightarrow x = 4\\). Se requiere \\(x > 1\\) y \\(x \\neq -1\\) para que el dominio sea válido. \\(x = 4\\) cumple ambas condiciones. ✓"
},
{
    pregunta: "Resuelve: \\(\\log_3(x+2) = 1 + \\log_3(x-1)\\)",
    imagen: "",
    opciones: [
        "\\(x = 5\\)",
        "\\(x = \\dfrac{5}{2}\\)",
        "\\(x = \\dfrac{7}{2}\\)"
    ],
    respuestaCorrecta: "\\(x = \\dfrac{5}{2}\\)",
    formula: "\\(\\log_b(M) - \\log_b(N) = \\log_b\\!\\left(\\frac{M}{N}\\right)\\)",
    explicacion: "N/A"
},
{
    pregunta: "Resuelve: \\(\\log_4(x) + \\log_4(x-3) = 1 + \\log_4(2)\\)",
    imagen: "",
    opciones: [
        "\\(x = \\frac{3+\\sqrt{41}}{2}=4.701\\)",
        "\\(x = \\frac{3-\\sqrt{41}}{2}=-1.7016\\)",
        "\\(x = 4\\) o \\(x = -1\\)"
    ],
    respuestaCorrecta: "\\(x = \\frac{3+\\sqrt{41}}{2}=4.701\\)",
    formula: "\\(\\log_b(M)+\\log_b(N)=\\log_b(MN)\\) y \\(1 = \\log_4(4)\\)",
    explicacion: "Se llega a una ecuación de segundo grado en donde se tiene que resolver por formula general"
},
    ];

const questions=[...allQuestions]
.sort(()=>0.5-Math.random())
.slice(0,10);

questions.forEach(q=>{
q.selectedAnswer=null;
q.opciones=[...q.opciones].sort(()=>0.5-Math.random());
});

function startQuiz(){
const name=document.getElementById("student-name").value.trim();
if(name===""){alert("Escribe tu nombre");return;}
studentName=name;
testStarted=true;
document.getElementById("start-container").style.display="none";
document.getElementById("quiz-container").style.display="block";
loadQuestion(currentQuestionIndex);
}

function loadQuestion(index){

const question=questions[index];
document.getElementById("question").innerHTML=question.pregunta;
document.getElementById("question-image").innerHTML="";

if(question.imagen){
const img=document.createElement("img");
img.src=question.imagen;
img.style.maxWidth="100%";
document.getElementById("question-image").appendChild(img);
}

document.getElementById("question-number").innerHTML=
`Pregunta ${index+1} de ${questions.length}`;

const optionsContainer=document.getElementById("options");
optionsContainer.innerHTML="";

question.opciones.forEach(option=>{
const li=document.createElement("li");
li.innerHTML=option;

li.onclick=()=>{
if(question.selectedAnswer!==null) return;

question.selectedAnswer=option;
li.style.backgroundColor="#66cc66";

document.getElementById("next-question").style.display=
index<questions.length-1?"inline-block":"none";

document.getElementById("finish-test").style.display=
index===questions.length-1?"inline-block":"none";
};

optionsContainer.appendChild(li);
});

document.getElementById("next-question").style.display="none";
document.getElementById("finish-test").style.display="none";

MathJax.typesetPromise();
}

function loadNextQuestion(){
currentQuestionIndex++;
loadQuestion(currentQuestionIndex);
}

function finishTest(){

score=0;

questions.forEach(q=>{
if(q.selectedAnswer===q.respuestaCorrecta){
score++;
}
});

const total=questions.length;
const errores=total-score;
const porcentaje=((score/total)*100).toFixed(2);

document.getElementById("quiz-container").style.display="none";

let html=`<h2>Resultado</h2>
<p>${studentName}, obtuviste <strong>${score}</strong> de ${total} (${porcentaje}%).</p>
<h3>Revisión:</h3>`;

questions.forEach(q=>{

let correcta=q.selectedAnswer===q.respuestaCorrecta;
let fondo=correcta?"#d4edda":"#f8d7da";
let borde=correcta?"#28a745":"#dc3545";
let icono=correcta?"✔ Correcta":"✘ Incorrecta";

html+=`
<div style="
background:${fondo};
border:2px solid ${borde};
margin:12px 0;
padding:16px;
border-radius:8px;
">
<strong>${icono}</strong><br><br>
<strong>Pregunta:</strong> ${q.pregunta}<br>
<strong>Tu respuesta:</strong> ${q.selectedAnswer || "No respondida"}<br>
<strong>Respuesta correcta:</strong> ${q.respuestaCorrecta}<br><br>
<strong>Explicación:</strong> ${q.explicacion}
</div>
`;
});

document.getElementById("result").innerHTML=html;
MathJax.typesetPromise();

const resumenPreguntas = questions.map((q, index) => {
    return {
        numero: index + 1,
        pregunta: q.pregunta,
        imagen: q.imagen || "",
        respuestaSeleccionada: q.selectedAnswer || "No respondida",
        respuestaCorrecta: q.respuestaCorrecta,
        formula: q.formula || "N/A",
        explicacion: q.explicacion || "N/A",
        resultado: q.selectedAnswer === q.respuestaCorrecta ? "Correcta" : "Incorrecta"
    };
});

fetch("https://script.google.com/macros/s/AKfycbxVg3d9f54YEtoiVBBv_OCZM-K7f5CpLKD8BDPFaDnW70whe_D2jsARIepNDxSxxa6I/exec",{
method:"POST",
body:JSON.stringify({
titulo:testTitle,
nombre:studentName,
aciertos:score,
errores:errores,
total:total,
porcentaje:porcentaje,
preguntas:resumenPreguntas
})
});
}

document.addEventListener("visibilitychange", function(){
    if(document.hidden && testStarted){
        location.reload();
    }
});

</script>
</body>
</html>
