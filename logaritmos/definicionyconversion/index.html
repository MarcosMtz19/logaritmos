<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title id="page-title"></title>

<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async
src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.0/es5/tex-mml-chtml.js"></script>

<style>
body{
    background:#ccffcc;
    font-size:18px;
}
#quiz-container{
    width:80%;
    max-width:600px;
    margin:auto;
    text-align:center;
    background:#fff;
    padding:20px;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    display:none;
}
.question-container,.option-container{
    background:#f0f0f0;
    border:1px solid #ddd;
    margin:10px 0;
    padding:16px;
    border-radius:5px;
}
#options{
    padding-left:0;
}
#options li{
    list-style:none;
    margin:5px 0;
    padding:15px;
    background:#e9ffe9;
    cursor:pointer;
    border-radius:5px;
}
#options li:hover{
    background:#d0ffd0;
}
button{
    margin-top:15px;
    padding:10px 20px;
    font-size:16px;
}
#question-number{
    font-size:20px;
    margin-bottom:10px;
}
.warning-box{
    width:80%;
    max-width:700px;
    margin:20px auto;
    padding:15px;
    background:#fff3cd;
    border:2px solid #ffcc00;
    border-radius:8px;
    color:#664d03;
    font-size:20px;
    text-align:center;
}
</style>
</head>

<body>

<div id="start-container" style="text-align:center;margin-top:50px;">

<h1 id="test-title-heading"></h1>

<div class="warning-box">
    <strong>Advertencia:</strong> En caso de cambiar de pestaña, cerrar navegador o cambiar de aplicación se cancelará el avance y se reiniciará el test.
</div>

<h2>Ingresa tu primer nombre y primer apellido</h2>

<input 
    type="text" 
    id="student-name" 
    placeholder="Ejemplo: JUAN PEREZ" 
    style="padding:10px;font-size:18px;text-transform:uppercase;"
    oninput="
        this.value = this.value
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[^A-Za-z\s]/g, '')
            .toUpperCase();
    "
>
<br><br>
<button onclick="startQuiz()">Comenzar Test</button>
</div>

<div id="quiz-container">
<div id="question-number"></div>
<div class="question-container" id="question"></div>
<div id="question-image"></div>
<ul id="options"></ul>
<button id="next-question" onclick="loadNextQuestion()">Siguiente</button>
<button id="finish-test" onclick="finishTest()">Terminar Test</button>
</div>

<div id="result"></div>

<script>

let studentName="";
let currentQuestionIndex=0;
let score=0;
let testStarted=false;

const testTitle = "Definición de logarítmo y Conversión de forma logarítmica a exponencial y viceversa";

document.title = testTitle;
document.getElementById("test-title-heading").textContent = testTitle;
const allQuestions = [
{
    pregunta: "Convierte a forma logarítmica: \\(2^{-5} = \\dfrac{1}{32}\\)",
    imagen: "",
    opciones: [
        "\\(\\log_2\\!\\left(\\dfrac{1}{32}\\right) = -5\\)",
        "\\(\\log_{-5}(2) = \\dfrac{1}{32}\\)",
        "\\(\\log_{\\frac{1}{32}}(2) = -5\\)"
    ],
    respuestaCorrecta: "\\(\\log_2\\!\\left(\\dfrac{1}{32}\\right) = -5\\)",
    formula: "\\(b^n = x \\Leftrightarrow \\log_b(x) = n\\)",
    explicacion: "Base = 2, exponente = \\(-5\\), resultado = \\(\\frac{1}{32}\\). Forma log: \\(\\log_2\\!\\left(\\frac{1}{32}\\right) = -5\\)."
},
{
    pregunta: "Convierte a forma logarítmica: \\(9^{3/2} = 27\\)",
    imagen: "",
    opciones: [
        "\\(\\log_9(27) = \\dfrac{3}{2}\\)",
        "\\(\\log_{27}(9) = \\dfrac{3}{2}\\)",
        "\\(\\log_9\\!\\left(\\dfrac{3}{2}\\right) = 27\\)"
    ],
    respuestaCorrecta: "\\(\\log_9(27) = \\dfrac{3}{2}\\)",
    formula: "\\(b^n = x \\Leftrightarrow \\log_b(x) = n\\)",
    explicacion: "Base = 9, exponente = \\(\\frac{3}{2}\\), resultado = 27. Verifica: \\(9^{3/2} = (9^{1/2})^3 = 3^3 = 27\\). Forma log: \\(\\log_9(27) = \\frac{3}{2}\\)."
},
{
    pregunta: "Convierte a forma logarítmica: \\(e^{2x} = k\\)",
    imagen: "",
    opciones: [
        "\\(\\ln(k) = 2x\\)",
        "\\(\\log_{2x}(k) = e\\)",
        "\\(\\ln(2x) = k\\)"
    ],
    respuestaCorrecta: "\\(\\ln(k) = 2x\\)",
    formula: "\\(b^n = x \\Leftrightarrow \\log_b(x) = n\\)",
    explicacion: "Base = \\(e\\), exponente = \\(2x\\), resultado = \\(k\\). Forma log (\\(\\log_e = \\ln\\)): \\(\\ln(k) = 2x\\)."
},
{
    pregunta: "Convierte a forma logarítmica y determina el valor de 'x': \\(4^x = \\dfrac{1}{2}\\)",
    imagen: "",
    opciones: [
        "\\(\\log_4\\!\\left(\\dfrac{1}{2}\\right) = x \\Rightarrow x = -\\dfrac{1}{2}\\)",
        "\\(\\log_4\\!\\left(\\dfrac{1}{2}\\right) = x \\Rightarrow x = \\dfrac{1}{2}\\)",
        "\\(\\log_{1/2}(4) = x \\Rightarrow x = -2\\)"
    ],
    respuestaCorrecta: "\\(\\log_4\\!\\left(\\dfrac{1}{2}\\right) = x \\Rightarrow x = -\\dfrac{1}{2}\\)",
    formula: "\\(b^n = x \\Leftrightarrow \\log_b(x) = n\\)",
    explicacion: "Forma log: \\(\\log_4\\!\\left(\\frac{1}{2}\\right) = x\\). Como \\(4^x = 2^{2x} = 2^{-1}\\), igualando: \\(2x = -1 \\Rightarrow x = -\\frac{1}{2}\\)."
},
{
    pregunta: "Convierte a forma logarítmica: \\(\\left(\\dfrac{1}{3}\\right)^4 = \\dfrac{1}{81}\\)",
    imagen: "",
    opciones: [
        "\\(\\log_{1/3}\\!\\left(\\dfrac{1}{81}\\right) = 4\\)",
        "\\(\\log_4\\!\\left(\\dfrac{1}{81}\\right) = \\dfrac{1}{3}\\)",
        "\\(\\log_3\\!\\left(\\dfrac{1}{81}\\right) = -4\\)"
    ],
    respuestaCorrecta: "\\(\\log_{1/3}\\!\\left(\\dfrac{1}{81}\\right) = 4\\)",
    formula: "\\(b^n = x \\Leftrightarrow \\log_b(x) = n\\)",
    explicacion: "Base = \\(\\frac{1}{3}\\), exponente = 4, resultado = \\(\\frac{1}{81}\\). Forma log: \\(\\log_{1/3}\\!\\left(\\frac{1}{81}\\right) = 4\\). Nota: base negativa en forma \\(\\log_3\\) daría \\(-4\\), pero la base real aquí es \\(\\frac{1}{3}\\)."
},
{
    pregunta: "Convierte a forma exponencial: \\(\\log_{1/2}(8) = -3\\)",
    imagen: "",
    opciones: [
        "\\(\\left(\\frac{1}{2}\\right)^{-3} = 8\\)",
        "\\(\\left(\\frac{1}{2}\\right)^{3} = 8\\)",
        "\\(8^{-3} = \\frac{1}{2}\\)"
    ],
    respuestaCorrecta: "\\(\\left(\\frac{1}{2}\\right)^{-3} = 8\\)",
    formula: "\\(\\log_b(x) = n \\Leftrightarrow b^n = x\\)",
    explicacion: "\\(\\log_{1/2}(8) = -3\\) se convierte en \\(\\left(\\tfrac{1}{2}\\right)^{-3} = 8\\). Verificación: \\(\\left(\\tfrac{1}{2}\\right)^{-3} = 2^3 = 8\\). ✓"
},
{
    pregunta: "Convierte a forma exponencial y determina \\(x\\): \\(\\log_{\\sqrt{5}}(125) = x\\)",
    imagen: "",
    opciones: [
        "\\((\\sqrt{5})^x = 125 \\Rightarrow x = 6\\)",
        "\\((\\sqrt{5})^x = 125 \\Rightarrow x = 3\\)",
        "\\(5^x = 125 \\Rightarrow x = 3\\)"
    ],
    respuestaCorrecta: "\\((\\sqrt{5})^x = 125 \\Rightarrow x = 6\\)",
    formula: "\\(\\log_b(x) = n \\Leftrightarrow b^n = x\\)",
    explicacion: "Forma exp: \\((\\sqrt{5})^x = 125\\). Como \\(\\sqrt{5} = 5^{1/2}\\), se tiene \\(5^{x/2} = 5^3\\), por tanto \\(x/2 = 3 \\Rightarrow x = 6\\)."
},
{
    pregunta: "Convierte a forma exponencial: \\(\\log_6\\!\\left(\\dfrac{1}{216}\\right) = -3\\)",
    imagen: "",
    opciones: [
        "\\(6^{-3} = \\dfrac{1}{216}\\)",
        "\\(6^3 = \\dfrac{1}{216}\\)",
        "\\((-3)^6 = \\dfrac{1}{216}\\)"
    ],
    respuestaCorrecta: "\\(6^{-3} = \\dfrac{1}{216}\\)",
    formula: "\\(\\log_b(x) = n \\Leftrightarrow b^n = x\\)",
    explicacion: "\\(\\log_6\\!\\left(\\frac{1}{216}\\right) = -3\\) equivale a \\(6^{-3} = \\frac{1}{216}\\). Verifica: \\(\\frac{1}{6^3} = \\frac{1}{216}\\). ✓"
},
{
    pregunta: "Si \\(\\log_b\\!\\left(\\dfrac{1}{\\sqrt{2}}\\right) = -\\dfrac{1}{2}\\), encuentra \\(b\\).",
    imagen: "",
    opciones: [
        "\\(b = 2\\)",
        "\\(b = \\sqrt{2}\\)",
        "\\(b = 4\\)"
    ],
    respuestaCorrecta: "\\(b = 2\\)",
    formula: "\\(\\log_b(x) = n \\Leftrightarrow b^n = x\\)",
    explicacion: "Forma exp: \\(b^{-1/2} = \\frac{1}{\\sqrt{2}} = 2^{-1/2}\\). Igualando bases: \\(b = 2\\)."
},
{
    pregunta: "Convierte a forma exponencial y resuelve \\(x\\): \\(\\log_x\\!\\left(\\dfrac{1}{64}\\right) = -3\\)",
    imagen: "",
    opciones: [
        "\\(x^{-3} = \\dfrac{1}{64} \\Rightarrow x = 4\\)",
        "\\(x^{-3} = \\dfrac{1}{64} \\Rightarrow x = 8\\)",
        "\\(x^3 = 64 \\Rightarrow x = 8\\)"
    ],
    respuestaCorrecta: "\\(x^{-3} = \\dfrac{1}{64} \\Rightarrow x = 4\\)",
    formula: "\\(\\log_b(x) = n \\Leftrightarrow b^n = x\\)",
    explicacion: "Forma exp: \\(x^{-3} = \\frac{1}{64}\\), entonces \\(x^3 = 64 = 4^3\\), por tanto \\(x = 4\\)."
},
    ];

const questions=[...allQuestions]
.sort(()=>0.5-Math.random())
.slice(0,5);

questions.forEach(q=>{
q.selectedAnswer=null;
q.opciones=[...q.opciones].sort(()=>0.5-Math.random());
});

function startQuiz(){
const name=document.getElementById("student-name").value.trim();
if(name===""){alert("Escribe tu nombre");return;}
studentName=name;
testStarted=true;
document.getElementById("start-container").style.display="none";
document.getElementById("quiz-container").style.display="block";
loadQuestion(currentQuestionIndex);
}

function loadQuestion(index){

const question=questions[index];
document.getElementById("question").innerHTML=question.pregunta;
document.getElementById("question-image").innerHTML="";

if(question.imagen){
const img=document.createElement("img");
img.src=question.imagen;
img.style.maxWidth="100%";
document.getElementById("question-image").appendChild(img);
}

document.getElementById("question-number").innerHTML=
`Pregunta ${index+1} de ${questions.length}`;

const optionsContainer=document.getElementById("options");
optionsContainer.innerHTML="";

question.opciones.forEach(option=>{
const li=document.createElement("li");
li.innerHTML=option;

li.onclick=()=>{
if(question.selectedAnswer!==null) return;

question.selectedAnswer=option;
li.style.backgroundColor="#66cc66";

document.getElementById("next-question").style.display=
index<questions.length-1?"inline-block":"none";

document.getElementById("finish-test").style.display=
index===questions.length-1?"inline-block":"none";
};

optionsContainer.appendChild(li);
});

document.getElementById("next-question").style.display="none";
document.getElementById("finish-test").style.display="none";

MathJax.typesetPromise();
}

function loadNextQuestion(){
currentQuestionIndex++;
loadQuestion(currentQuestionIndex);
}

function finishTest(){

score=0;

questions.forEach(q=>{
if(q.selectedAnswer===q.respuestaCorrecta){
score++;
}
});

const total=questions.length;
const errores=total-score;
const porcentaje=((score/total)*100).toFixed(2);

document.getElementById("quiz-container").style.display="none";

let html=`<h2>Resultado</h2>
<p>${studentName}, obtuviste <strong>${score}</strong> de ${total} (${porcentaje}%).</p>
<h3>Revisión:</h3>`;

questions.forEach(q=>{

let correcta=q.selectedAnswer===q.respuestaCorrecta;
let fondo=correcta?"#d4edda":"#f8d7da";
let borde=correcta?"#28a745":"#dc3545";
let icono=correcta?"✔ Correcta":"✘ Incorrecta";

html+=`
<div style="
background:${fondo};
border:2px solid ${borde};
margin:12px 0;
padding:16px;
border-radius:8px;
">
<strong>${icono}</strong><br><br>
<strong>Pregunta:</strong> ${q.pregunta}<br>
<strong>Tu respuesta:</strong> ${q.selectedAnswer || "No respondida"}<br>
<strong>Respuesta correcta:</strong> ${q.respuestaCorrecta}<br><br>
<strong>Explicación:</strong> ${q.explicacion}
</div>
`;
});

document.getElementById("result").innerHTML=html;
MathJax.typesetPromise();

const resumenPreguntas = questions.map((q, index) => {
    return {
        numero: index + 1,
        pregunta: q.pregunta,
        imagen: q.imagen || "",
        respuestaSeleccionada: q.selectedAnswer || "No respondida",
        respuestaCorrecta: q.respuestaCorrecta,
        formula: q.formula || "N/A",
        explicacion: q.explicacion || "N/A",
        resultado: q.selectedAnswer === q.respuestaCorrecta ? "Correcta" : "Incorrecta"
    };
});

fetch("https://script.google.com/macros/s/AKfycbxVg3d9f54YEtoiVBBv_OCZM-K7f5CpLKD8BDPFaDnW70whe_D2jsARIepNDxSxxa6I/exec",{
method:"POST",
body:JSON.stringify({
titulo:testTitle,
nombre:studentName,
aciertos:score,
errores:errores,
total:total,
porcentaje:porcentaje,
preguntas:resumenPreguntas
})
});
}

document.addEventListener("visibilitychange", function(){
    if(document.hidden && testStarted){
        location.reload();
    }
});

</script>
</body>
</html>
